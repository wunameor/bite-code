<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图书列表展示</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">

    <link rel="stylesheet" href="css/list.css">
    <script type="text/javascript" src="js/jquery.min.js"></script>
    <script type="text/javascript" src="js/bootstrap.min.js"></script>
    <script src="js/jq-paginator.js"></script>

</head>

<body>
    <div class="bookContainer">
        <h2>图书列表展示</h2>
        <div class="navbar-justify-between">
            <div>
                <button class="btn btn-outline-info" type="button" onclick="location.href='book_add.html'">添加图书</button>
                <button class="btn btn-outline-info" type="button" onclick="batchDelete()">批量删除</button>
            </div>
        </div>

        <table>
            <thead>
                <tr>
                    <td>选择</td>
                    <td class="width100">图书ID</td>
                    <td>书名</td>
                    <td>作者</td>
                    <td>数量</td>
                    <td>定价</td>
                    <td>出版社</td>
                    <td>状态</td>
                    <td class="width200">操作</td>
                </tr>
            </thead>
            <tbody>

            </tbody>
        </table>

        <div class="demo">
            <ul id="pageContainer" class="pagination justify-content-center"></ul>
        </div>
        <script>
            let pageRequest = {
                currentPage: 1,
                size: 10
            };

            // 页面加载时，先获取数据，再初始化分页器
            getBookList(true);

            function getBookList(isInit = false) {
                $.ajax({
                    url: `/book/getListByPage?currentPage=${pageRequest.currentPage}&size=${pageRequest.size}`,
                    type: "get",
                    success: (result) => {
                        let books = result.pages;
                        let finalHtml = "";
                        for (let book of books) {
                            finalHtml += `
                <tr>
                    <td><input type="checkbox" name="selectBook" value="${book.id}" class="book-select"></td>
                    <td>${book.id}</td>
                    <td>${book.bookName}</td>
                    <td>${book.author}</td>
                    <td>${book.count}</td>
                    <td>${book.price}</td>
                    <td>${book.publish}</td>
                    <td>${book.statusCN}</td>
                    <td>
                        <div class="op">
                            <a href="book_update.html?bookId=${book.id}">修改</a>
                            <a href="javascript:void(0)" onclick="deleteBook(${book.id})">删除</a>
                        </div>
                    </td>
                </tr>
                `;
                        }
                        $("tbody").html(finalHtml);

                        // 如果是第一次加载，初始化分页器
                        if (isInit) {
                            initPagination(result.totalCount);
                        } else {
                            // 如果不是第一次加载，只更新分页器的总条数选项
                            $("#pageContainer").jqPaginator('option', 'totalCounts', result.totalCount);
                        }
                    }
                });
            }

            // 单独提取分页器初始化方法
            function initPagination(totalCount) {
                $("#pageContainer").jqPaginator({
                    totalCounts: totalCount,
                    pageSize: pageRequest.size,
                    visiblePages: 5,
                    currentPage: pageRequest.currentPage, // 使用我们自己维护的页码
                    first: '<li class="page-item"><a class="page-link">首页</a></li>',
                    prev: '<li class="page-item"><a class="page-link" href="javascript:void(0);">上一页<\/a><\/li>',
                    next: '<li class="page-item"><a class="page-link" href="javascript:void(0);">下一页<\/a><\/li>',
                    last: '<li class="page-item"><a class="page-link" href="javascript:void(0);">最后一页<\/a><\/li>',
                    page: '<li class="page-item"><a class="page-link" href="javascript:void(0);">{{page}}<\/a><\/li>',
                    onPageChange: function (page, type) {
                        // 只有在用户主动点击改变页码时才请求数据
                        if (type == 'change') {
                            pageRequest.currentPage = page;
                            getBookList(false); // 传入 false，表示不需要重新初始化分页器
                        }
                    }
                });
            }




            function deleteBook(id) {
                var isDelete = confirm("确认删除?");
                if (isDelete) {
                    //删除图书
                    // alert("删除成功");
                    $.ajax({
                        url: "/book/deleteBookById",
                        type: "post",
                        data: {
                            bookId: id
                        },
                        success(result) {
                            getBookList(true)
                        }
                    })
                }
            }

            function batchDelete() {
                var isDelete = confirm("确认批量删除?");
                if (isDelete) {
                    //获取复选框的id
                    var ids = [];
                    $("input:checkbox[name='selectBook']:checked").each(function () {
                        ids.push($(this).val());
                    });
                    console.log(ids);
                    $.ajax({
                        url: "/book/batchDeleteBookByIds",
                        type: "post",
                        data: {
                            bookIds: ids
                        },
                        success(result) {
                            getBookList(true)
                        }
                    })
                    // alert("批量删除成功");
                }
            }

        </script>
    </div>
</body>

</html>
