<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>博客详情页</title>

    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/detail.css">

</head>

<body>
    <div class="nav">
        <img src="pic/logo2.jpg" alt="">
        <span class="blog-title">我的博客系统</span>
        <div class="space"></div>
        <a class="nav-span" href="blog_list.html">主页</a>
        <a class="nav-span" href="blog_edit.html">写博客</a>
        <a class="nav-span" href="#" onclick="logout()">注销</a>
    </div>

    <div class="container">
        <div class="left">
            <div class="card">
                <img src="pic/doge.jpg" alt="">
                <h3></h3>
                <a href="#">GitHub 地址</a>
                <div class="row">
                    <span>文章</span>
                    <span>分类</span>
                </div>
                <div class="row">
                    <span>2</span>
                    <span>1</span>
                </div>
            </div>
        </div>
        <div class="right">


        </div>
    </div>

    <!-- 引入 editor.md 的依赖 -->
    <link rel="stylesheet" href="blog-editormd/css/editormd.css" />
    <script src="js/jquery.min.js"></script>
    <script src="blog-editormd/lib/marked.min.js"></script>
    <script src="blog-editormd/lib/prettify.min.js"></script>
    <script src="blog-editormd/editormd.js"></script>
    <script src="js/common.js"></script>
    <script>
        getUserInfo(`/user/getUserInfoByBlogId${location.search}`)

        $(function () {
            var editor = editormd("editor", {
                width: "100%",
                height: "550px",
                path: "blog-editormd/lib/",
                markdown: "# this is a test"
            });
        });


        $.ajax({
            url: `/blog/getBlogDetail${location.search}`,
            type: "get",
            success: (result) => {
                if (result.data != null && result.code === 2000) {
                    let htmlResult = ''
                    let blog = result.data

                    htmlResult += `
                    <div class="content">
                        <div class="title">${blog.title}</div>
                        <div class="date">${blog.updateTime}</div>
                        <div class="detail" id="detail" style="background: transparent"></div>
                        <div class="operating"
                        style="display: ${blog.userId != localStorage.getItem('loginUserId') ? 'none' : ''}">
                            <button onclick="window.location.href='blog_update.html${location.search}'">编辑</button>
                            <button onclick="deleteBlog(${blog.id})">删除</button>
                        </div>
                    </div>`

                    $(".container .right").html(htmlResult)

                    editormd.markdownToHTML("detail", {
                        markdown: blog.content
                    })
                }
            }
        })
        //显示博客作者信息
        //var userUrl = "/user/getAuthorInfo" + location.search;
        //getUserInfo(userUrl);

        function deleteBlog(blogId) {
            // alert("删除博客");
            if (!confirm("确认要删除吗？")) {
                return
            }
            $.ajax({
                url: "/blog/delete",
                type: "post",
                data: {
                    blogId
                },
                success: (result) => {
                    if (result != null && result.code === 2000 && result.data) {
                        location.href = 'blog_list.html'
                    }
                }
            })
        }
    </script>
</body>

</html>
