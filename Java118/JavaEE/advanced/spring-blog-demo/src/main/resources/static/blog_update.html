<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>博客编辑页</title>

    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/edit.css">
    <link rel="stylesheet" href="blog-editormd/css/editormd.css" />

</head>

<body>
    <div class="nav">
        <img src="pic/logo2.jpg" alt="">
        <span class="blog-title">我的博客系统</span>
        <div class="space"></div>
        <a class="nav-span" href="blog_list.html">主页</a>
        <a class="nav-span" href="blog_edit.html">写博客</a>
        <a class="nav-span" href="#" onclick="logout()">注销</a>
    </div>
    <div class="content-edit">
        <div class="push">
            <input type="hidden" id="blogId">
            <input type="text" name="" id="title">
            <input type="button" value="更新文章" id="submit" onclick="submit()">
        </div>
        <!-- markdown 插件 html代码 -->
        <div id="editor">
            <textarea style="display:none;" id="content"></textarea>
        </div>
    </div>

    <link rel="stylesheet" href="blog-editormd/css/editormd.css" />
    <script src="js/jquery.min.js"></script>
    <script src="blog-editormd/lib/marked.min.js"></script>
    <script src="blog-editormd/lib/prettify.min.js"></script>
    <script src="blog-editormd/editormd.js"></script>
    <script src="js/common.js"></script>
    <script type="text/javascript">

        var editor = null;
        var blogContent = null;

        $(function () {
            editor = editormd("editor", {
                width: "100%",
                height: "550px",
                path: "blog-editormd/lib/",
                onload: function () {
                    if (blogContent != null) {
                        this.setMarkdown(blogContent);
                    }
                }
            });
        });

        function submit() {
            $.ajax({
                url: "/blog/update",
                type: "post",
                contentType: "application/json",
                data: JSON.stringify({
                    id: new URLSearchParams(location.search).get('blogId'),
                    title: $("#title").val(),
                    content: $("#content").val()
                }),
                success: (result) => {
                    if (result != null && result.data && result.code === 2000) {
                        location.href = "blog_list.html"
                    }
                }
            })
        }
        function getBlogInfo() {
            $.ajax({
                url: `/blog/getBlogDetail${location.search}`,
                type: "get",
                success: (result) => {
                    if (result.data != null && result.code === 2000) {
                        let blog = result.data;
                        $("#blogId").val(blog.id);
                        $("#title").val(blog.title);
                        blogContent = blog.content;
                        if (editor) {
                            editor.setMarkdown(blogContent);
                        }
                    }
                }
            })
        }
        getBlogInfo();
    </script>
</body>

</html>
