<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>注册页面</title>

    <!-- 所有静态资源已本地化，避免 CDN 不可用时整页样式/脚本失效 -->
    <link rel="stylesheet" href="/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/toastr.min.css">

    <script src="/js/jquery.min.js"></script>
    <script src="/js/jquery.validate.min.js"></script>
    <script src="/js/toastr.min.js"></script>
    <script src="/js/auth.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #fff;
            margin: 0;
            padding: 0;
        }

        .register-container {
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background-color: #fff;
            border-radius: 5px;
        }

        .register-container h2 {
            font-weight: 600;
            font-size: 32px;
            letter-spacing: 1px;
            color: #000000;
            line-height: 50px;
            text-align: center;
            margin-bottom: 60px;
        }

        /* 验证码输入框 + 获取按钮 */
        .code-box {
            display: flex;
            align-items: center;
        }

        .code-box .form-control {
            width: calc(100% - 140px);
        }

        .code-box .btn-primary {
            width: 126px;
            height: 48px;
            margin-left: 10px;
            box-sizing: border-box;
            font-size: 15px;
            padding: 0;
        }

        .code-box .btn-primary:disabled {
            opacity: .65;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
<div class="register-container">
    <h2>填写注册信息</h2>
    <form id="registerForm" method="post">
        <div class="form-group" id="identityGroup">
            <label>用户类型</label>
            <div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="identity"
                           id="identityNormal" value="1" checked>
                    <label class="form-check-label" for="identityNormal">普通用户</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="identity"
                           id="identityAdmin" value="0">
                    <label class="form-check-label" for="identityAdmin">管理员</label>
                </div>
            </div>
        </div>
        <div class="form-group">
            <label for="name">姓名</label>
            <input type="text" class="form-control" id="name"
                   name="name" placeholder="请输入姓名" autocomplete="name" required>
        </div>
        <div class="form-group">
            <label for="mail">邮箱</label>
            <input type="email" class="form-control" id="mail"
                   name="mail" placeholder="请输入邮箱" autocomplete="email" required>
        </div>
        <div class="form-group">
            <label for="emailCode">邮箱验证码</label>
            <div class="code-box">
                <input type="text" class="form-control" id="emailCode" name="emailCode"
                       placeholder="请输入 6 位验证码" inputmode="numeric" maxlength="6"
                       autocomplete="one-time-code" required>
                <button type="button" class="btn btn-primary" id="sendCodeBtn">获取验证码</button>
            </div>
        </div>
        <div class="form-group">
            <label for="phoneNumber">手机号</label>
            <input type="tel" inputmode="numeric" class="form-control" id="phoneNumber"
                   name="phoneNumber" placeholder="请输入手机号" autocomplete="tel"
                   maxlength="11" required>
        </div>
        <div class="form-group" id="passwordGroup">
            <label for="password">密码</label>
            <input type="password" class="form-control" id="password"
                   name="password" placeholder="请输入 6-12 位字母或数字"
                   autocomplete="new-password" maxlength="12" required>
        </div>
        <div class="form-group" id="confirmPasswordGroup">
            <label for="confirmPassword">确认密码</label>
            <input type="password" class="form-control" id="confirmPassword"
                   name="confirmPassword" placeholder="请再次输入密码"
                   autocomplete="new-password" maxlength="12" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block">注册</button>
    </form>
</div>

<script>
    // 提示：优先用 toastr，第三方库异常时退回 alert，避免影响表单校验
    if (window.toastr) {
        toastr.options = {
            closeButton: true,
            progressBar: true,
            timeOut: 3000,
            positionClass: 'toast-top-center'
        };
    }

    function notifySuccess(message) {
        window.toastr ? toastr.success(message) : alert(message);
    }

    function notifyError(message) {
        window.toastr ? toastr.error(message) : alert(message);
    }

    var params = new URLSearchParams(window.location.search);
    var jumpList = params.get('jumpList') === 'true';
    // 后台 iframe 里才允许选择用户类型；公开页面强制普通用户
    var canChooseIdentity = jumpList || window.self !== window.top;

    function isAdminSelected() {
        return canChooseIdentity && $('input[name=identity]:checked').val() === '0';
    }

    function togglePasswordFields() {
        var admin = isAdminSelected();
        $('#passwordGroup, #confirmPasswordGroup').toggle(admin);
        if (!admin) {
            $('#password, #confirmPassword').val('');
        }
    }

    $('#identityGroup').toggle(canChooseIdentity);
    $('input[name=identity]').on('change', togglePasswordFields);
    togglePasswordFields();

    // jQuery Validate 核心包不含 pattern 方法，这里自定义两个校验方法
    $.validator.addMethod('phoneFormat', function (value, element) {
        return this.optional(element) || /^1[3-9]\d{9}$/.test(value);
    }, '手机号格式不正确（1 开头的 11 位数字）');

    $.validator.addMethod('passwordFormat', function (value, element) {
        return this.optional(element) || /^[0-9A-Za-z]{6,12}$/.test(value);
    }, '密码必须为 6-12 位字母或数字');

    // 使用 jQuery Validate 插件来验证表单
    $("#registerForm").validate({
        rules: {
            name: "required",
            mail: {
                required: true,
                email: true
            },
            phoneNumber: {
                required: true,
                phoneFormat: true
            },
            emailCode: {
                required: true,
                digits: true,
                minlength: 6,
                maxlength: 6
            },
            password: {
                required: function () {
                    return isAdminSelected();
                },
                passwordFormat: true
            },
            confirmPassword: {
                required: function () {
                    return isAdminSelected();
                },
                equalTo: '#password'
            }
        },
        messages: {
            name: "请输入您的姓名",
            mail: "请输入有效的邮箱地址",
            phoneNumber: {
                required: "请输入您的手机号"
            },
            emailCode: {
                required: "请输入邮箱验证码",
                digits: "验证码只能是数字",
                minlength: "验证码为 6 位数字",
                maxlength: "验证码为 6 位数字"
            },
            password: {
                required: "请输入密码"
            },
            confirmPassword: {
                required: "请再次输入密码",
                equalTo: "两次输入的密码不一致"
            }
        },
        submitHandler: function (form) {
            var $btn = $(form).find('button[type=submit]');
            var redirecting = false;
            // 防止重复提交
            $btn.prop('disabled', true).text('注册中...');

            var admin = isAdminSelected();
            var formData = {
                userName: $('#name').val().trim(),
                email: $('#mail').val().trim().toLowerCase(),
                phoneNumber: $('#phoneNumber').val().trim(),
                password: admin ? $('#password').val() : '',
                identity: admin ? 0 : 1,
                emailCode: $('#emailCode').val().trim()
            };

            $.ajax({
                url: '/user/register',
                type: 'post',
                contentType: 'application/json',
                data: JSON.stringify(formData),
                success: function (result) {
                    if (result.code === 200) {
                        redirecting = true;
                        notifySuccess('注册成功');
                        if (jumpList) {
                            // 后台 iframe：注册完回到人员列表
                            window.parent.postMessage({
                                from: 'user-list.html',
                                id: '#userList'
                            }, '*');
                        } else {
                            var target = admin ? 'blogin.html' : 'login.html';
                            setTimeout(function () {
                                location.href = target;
                            }, 1000);
                        }
                    } else {
                        notifyError(result.message);
                    }
                },
                error: function (xhr) {
                    notifyError('请求失败：' + xhr.status + ' ' + xhr.statusText);
                },
                complete: function () {
                    // 注册成功后保持按钮禁用，等待跳转，避免重复提交
                    if (!redirecting) {
                        $btn.prop('disabled', false).text('注册');
                    }
                }
            });
            return false; // 阻止表单的默认提交行为
        }
    });

    // ==================== 获取邮箱验证码 ====================
    var COUNTDOWN_SECONDS = 60;

    function resetSendCodeBtn() {
        $('#sendCodeBtn').prop('disabled', false).text('获取验证码');
    }

    function startCountdown($btn, seconds) {
        var left = seconds;
        $btn.text(left + 's 后重发');
        var timer = setInterval(function () {
            left--;
            if (left <= 0) {
                clearInterval(timer);
                resetSendCodeBtn();
            } else {
                $btn.text(left + 's 后重发');
            }
        }, 1000);
    }

    $('#sendCodeBtn').on('click', function () {
        var $btn = $(this);

        // 复用 jQuery Validate 的邮箱校验，格式不对直接在输入框下方提示
        if (!$('#registerForm').validate().element('#mail')) {
            return;
        }

        var email = $('#mail').val().trim().toLowerCase();
        $btn.prop('disabled', true).text('发送中...');

        $.ajax({
            url: '/user/email-code',
            type: 'post',
            timeout: 15000,
            contentType: 'application/json',
            data: JSON.stringify({scene: 'REGISTER', account: email}),
            success: function (result) {
                if (result.code === 200) {
                    notifySuccess('验证码已发送，请查收邮箱（5 分钟内有效）');
                    $('#emailCode').val('');
                    startCountdown($btn, COUNTDOWN_SECONDS);
                } else {
                    notifyError(result.message);
                    resetSendCodeBtn();
                }
            },
            error: function (xhr) {
                notifyError('发送失败：' + xhr.status + ' ' + xhr.statusText);
                resetSendCodeBtn();
            }
        });
    });
</script>
</body>
</html>
