<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>登录页面</title>

    <!-- 所有静态资源已本地化，避免 CDN 不可用时整页样式/脚本失效 -->
    <link rel="stylesheet" href="/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/toastr.min.css">

    <script src="/js/jquery.min.js"></script>
    <script src="/js/jquery.validate.min.js"></script>
    <script src="/js/toastr.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #fff;
            margin: 0;
            padding: 0;
        }

        .login-container {
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background-color: #fff;
            border-radius: 5px;
        }

        .login-container h2 {
            font-weight: 600;
            font-size: 32px;
            letter-spacing: 1px;
            color: #000000;
            line-height: 50px;
            text-align: center;
            margin-bottom: 40px;
        }

        /* 登录方式切换 */
        .tab-box {
            display: flex;
            align-items: center;
            margin-bottom: 30px;
        }

        .tab-box span {
            font-size: 18px;
            color: #000000;
            margin-right: 20px;
            cursor: pointer;
            padding-bottom: 10px;
        }

        .tab-box span.active {
            position: relative;
            color: #007bff;
        }

        .tab-box span.active::after {
            position: absolute;
            content: '';
            width: 30px;
            height: 2px;
            background-color: #007bff;
            border-radius: 5px;
            bottom: 0;
            left: 50%;
            transform: translate(-50%);
        }

        /* 验证码输入框 + 获取按钮 */
        .code-box {
            display: flex;
            align-items: center;
        }

        .code-box .form-control {
            width: calc(100% - 140px);
        }

        .code-box .btn-primary {
            width: 126px;
            height: 48px;
            margin-left: 10px;
            box-sizing: border-box;
            font-size: 15px;
            padding: 0;
        }

        .code-box .btn-primary:disabled {
            opacity: .65;
            cursor: not-allowed;
        }

        .register-link {
            text-align: center;
            font-size: 16px;
            color: #999999;
            margin-top: 20px;
        }
    </style>
</head>
<body>
<div class="login-container">
    <h2>欢迎登录</h2>

    <div class="tab-box">
        <span class="active" data-type="PASSWORD">密码登录</span>
        <span data-type="EMAIL_CODE">验证码登录</span>
    </div>

    <form id="loginForm" method="post">
        <div class="form-group">
            <label for="account">用户名 / 邮箱</label>
            <input type="text" class="form-control" id="account" name="account"
                   placeholder="请输入用户名或邮箱" autocomplete="username" required>
        </div>

        <div class="form-group" id="passwordGroup">
            <label for="password">密码</label>
            <input type="password" class="form-control" id="password" name="password"
                   placeholder="请输入密码" autocomplete="current-password" maxlength="12">
        </div>

        <div class="form-group" id="codeGroup" style="display: none;">
            <label for="emailCode">邮箱验证码</label>
            <div class="code-box">
                <input type="text" class="form-control" id="emailCode" name="emailCode"
                       placeholder="请输入 6 位验证码" inputmode="numeric" maxlength="6"
                       autocomplete="one-time-code">
                <button type="button" class="btn btn-primary" id="sendCodeBtn">获取验证码</button>
            </div>
        </div>

        <button type="submit" class="btn btn-primary btn-block">登录</button>
    </form>

    <p class="register-link">还没有账号？<a href="/register.html">立即注册</a></p>
</div>

<script>
    // 提示：优先用 toastr，第三方库异常时退回 alert
    if (window.toastr) {
        toastr.options = {
            closeButton: true,
            progressBar: true,
            timeOut: 3000,
            positionClass: 'toast-top-center'
        };
    }

    function notifySuccess(message) {
        window.toastr ? toastr.success(message) : alert(message);
    }

    function notifyError(message) {
        window.toastr ? toastr.error(message) : alert(message);
    }

    // ==================== 登录方式切换 ====================
    var loginType = 'PASSWORD';

    $('.tab-box span').on('click', function () {
        $('.tab-box span').removeClass('active');
        $(this).addClass('active');

        loginType = $(this).data('type');

        if (loginType === 'PASSWORD') {
            $('#passwordGroup').show();
            $('#codeGroup').hide();
        } else {
            $('#passwordGroup').hide();
            $('#codeGroup').show();
        }

        // 清掉上一个方式的错误提示，但保留已填内容
        $('#loginForm').validate().resetForm();
    });

    // ==================== 表单校验与提交 ====================
    // ignore: ':hidden' 很关键：隐藏的输入框不参与校验，
    // 否则密码登录会要求填验证码，验证码登录会要求填密码
    $("#loginForm").validate({
        ignore: ':hidden',
        rules: {
            account: {
                required: true
            },
            password: {
                required: true
            },
            emailCode: {
                required: true,
                digits: true,
                minlength: 6,
                maxlength: 6
            }
        },
        messages: {
            account: "请输入用户名或邮箱",
            password: "请输入密码",
            emailCode: {
                required: "请输入邮箱验证码",
                digits: "验证码只能是数字",
                minlength: "验证码为 6 位数字",
                maxlength: "验证码为 6 位数字"
            }
        },
        submitHandler: function (form) {
            var $btn = $(form).find('button[type=submit]');
            $btn.prop('disabled', true).text('登录中...');

            var formData = {
                type: loginType,
                account: $('#account').val().trim()
            };
            if (loginType === 'PASSWORD') {
                formData.password = $('#password').val();
            } else {
                formData.emailCode = $('#emailCode').val().trim();
            }

            $.ajax({
                url: '/user/login',
                type: 'post',
                contentType: 'application/json',
                data: JSON.stringify(formData),
                success: function (result) {
                    if (result.code === 200) {
                        // token 存起来，后续请求带 Authorization: Bearer <token>
                        localStorage.setItem('token', result.data.token);
                        localStorage.setItem('userId', result.data.userId);
                        localStorage.setItem('userName', result.data.userName);
                        notifySuccess('登录成功，欢迎 ' + result.data.userName);
                    } else {
                        notifyError(result.message);
                    }
                },
                error: function (xhr) {
                    notifyError('请求失败：' + xhr.status + ' ' + xhr.statusText);
                },
                complete: function () {
                    $btn.prop('disabled', false).text('登录');
                }
            });
            return false; // 阻止表单的默认提交行为
        }
    });

    // ==================== 获取登录验证码 ====================
    var COUNTDOWN_SECONDS = 60;

    function resetSendCodeBtn() {
        $('#sendCodeBtn').prop('disabled', false).text('获取验证码');
    }

    function startCountdown($btn, seconds) {
        var left = seconds;
        $btn.text(left + 's 后重发');
        var timer = setInterval(function () {
            left--;
            if (left <= 0) {
                clearInterval(timer);
                resetSendCodeBtn();
            } else {
                $btn.text(left + 's 后重发');
            }
        }, 1000);
    }

    $('#sendCodeBtn').on('click', function () {
        var $btn = $(this);

        if (!$('#loginForm').validate().element('#account')) {
            return;
        }

        var account = $('#account').val().trim();
        $btn.prop('disabled', true).text('发送中...');

        $.ajax({
            url: '/user/email-code',
            type: 'post',
            contentType: 'application/json',
            data: JSON.stringify({scene: 'LOGIN', account: account}),
            success: function (result) {
                if (result.code === 200) {
                    // 后端对不存在的账号也返回成功，避免被用来枚举用户
                    notifySuccess('验证码已发送（若账号存在），请查收邮箱，5 分钟内有效');
                    $('#emailCode').val('');
                    startCountdown($btn, COUNTDOWN_SECONDS);
                } else {
                    notifyError(result.message);
                    resetSendCodeBtn();
                }
            },
            error: function (xhr) {
                notifyError('发送失败：' + xhr.status + ' ' + xhr.statusText);
                resetSendCodeBtn();
            }
        });
    });
</script>
</body>
</html>
