<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <title>抽奖页面</title>
    <style type="text/css">
        * {
            margin: 0;
            padding: 0;
        }
        html, body {
            width: 100%;
            height: 100%;
        }
        body {
            text-align: center;
            background: url("./pic/bg.png") no-repeat;
            overflow: hidden;
            background-size: 100% 100%;
            font-weight: bold;
            color: #D40000;
        }
        /*
         * 页面使用纵向 flex 布局：奖名单区域负责撑满剩余空间。
         * 按钮容器固定在浏览器可视区域底部，避免小窗口时按钮被顶到屏幕外，
         * 也避免长用户名换行时把按钮上下顶动。
         */
        #container {
            min-width: 1000px;
            height: 100vh;
            min-height: 0;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 110px;
        }
        #title {
            font-size: 100px;
            margin-top: 80px;
        }
        #disc {
            font-size: 40px;
            margin: 10px 0;
        }
        #image {
            margin-top: 20px;
            max-height: 280px;
            border: 1px solid #E23540FF;
            border-radius: 20px;
        }
        #list {
            flex: 1 1 auto;
            min-height: 0;
            width: 100%;
            max-width: 800px;
            box-sizing: border-box;
            margin: 0 auto;
            overflow-y: auto;
            scrollbar-gutter: stable;
        }
        #list span {
            display: inline-block;
            width: 160px;
            font-size: 36px;
            margin-top: 8px;
        }
        .records-item {
            text-align: center;
            cursor: pointer;
            padding: 20px;
            transition: background-color 0.3s;
            font-size: 20px;
        }
        /* 操作区固定在可视页面底部，不参与名单高度变化 */
        .opt-box{
            position: fixed;
            left: 0;
            right: 0;
            bottom: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            z-index: 10;
        }
        .opt-box .btn{
            width: 120px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #D40000;
            margin-inline: 18px;
            cursor: pointer;
            border-radius: 4px;
            font-weight: normal;
            font-size: 15px;
        }
        .opt-box .btn:hover{
            background-color: #D40000;
            color: #fff;
        }
    </style>
</head>

<body>
<div id="container">
    <div id="title"></div>
    <div id="disc"></div>
    <img id="image" />
    <div id="list"></div>
    <div class="opt-box">
        <span class="btn pre-btn" onclick="previousStep()" style="display:none">查看上一奖项</span>
        <span class="btn next-btn" onclick="nextStep()">开始抽奖</span>
    </div>
</div>
<script src="./js/jquery.min.js"></script>
<script src="./js/auth.js"></script>
<script>

    var params = new URLSearchParams(window.location.search);
    var activityId = params.get('activityId');
    var valid = params.get('valid');
    var userToken = localStorage.getItem("user_token");


    // 获取网页上通过id为disc、image和list的DOM元素的引用。
    var disc = document.getElementById('disc')
    var image = document.getElementById('image')
    var list = document.getElementById('list')

    // 奖品列表
    var steps = null
    // 抽到第几个了
    var step = 0
    // 人员列表
    var names = null
    // 正在做什么
    var state = ''
    // 已提交但尚未确认结果的抽奖任务，key 为 requestId
    var pendingTasks = {}

    // 等待DOM加载完成
    document.addEventListener('DOMContentLoaded', function() {
        var titleDiv = document.getElementById('title');
        var activityName = params.get('activityName');
        titleDiv.textContent = activityName;
    });

    function formatDate(dateString) {
        var date = new Date(dateString);
        var hour = ('0' + date.getHours()).slice(-2);
        var minute = ('0' + date.getMinutes()).slice(-2);
        var second = ('0' + date.getSeconds()).slice(-2);
        // 构建格式化的日期字符串
        return hour + ':' + minute + ':' + second;
    }

    // showPic函数用于显示图片和奖品信息。
    // 它将data.disc设置为disc元素的innerHTML，将data.image设置为image元素的src属性，然后显示图片并隐藏列表。
    function showPic(data) {
        disc.innerHTML = data.prizeTierName + ' ' + data.name + ' ' + data.prizeAmount + '份'
        image.src = data.imageUrl ? data.imageUrl : '/pic/defaultPrizeImg.png'
        image.style.display = 'inline'
        list.style.display = 'none'
        while (list.hasChildNodes()) {
            list.removeChild(list.firstChild)
        }
    }

    // 查询中奖记录
    function showRecords() {
        disc.innerHTML = "中奖名单"
        image.style.display = 'none'
        list.style.display = 'block'
        while (list.hasChildNodes()) {
            list.removeChild(list.firstChild)
        }
        $.ajax({
            url: '/winning-records/show',
            type: 'POST',
            dataType: 'json',
            contentType: 'application/json',
            data: JSON.stringify({activityId: activityId}),
            headers: {
                'user_token': userToken
            },
            success: function(result) {
                if (result.code != 200) {
                    alert("查询中奖记录失败！" + result.message);
                } else {
                    var records = result.data
                    list.className = "records-item"
                    for (var i = 0; i < records.length; ++i) {
                        var item = document.createElement('div')
                        item.textContent = formatDate(records[i].winningTime) + ' '
                        + records[i].winnerName + ' '
                        + records[i].prizeName + ' '
                        + (records[i].prizeTierName || records[i].prizeTier) + ' '
                        list.appendChild(item)
                    }

                    // 分享链接
                    // 检查是否已经有分享按钮，如果没有则创建
                    var optBox = document.querySelector('.opt-box');
                    var existingBtn = optBox.querySelector('.btn.copy-btn');
                    if (!existingBtn) {
                        var newBtn = document.createElement('span');
                        newBtn.className = 'btn copy-btn';
                        // 设置点击事件处理函数
                        newBtn.onclick = function() {
                            // 创建URL对象
                            var currentUrl = new URL(window.location);
                            // 创建URLSearchParams对象
                            var searchParams = currentUrl.searchParams;
                            // 更新参数
                            searchParams.delete('valid');
                            searchParams.append('valid', false);
                            // 防止分享再分享，拼接多个参数
                            searchParams.delete('hideButton');
                            searchParams.append('hideButton', true);
                            // 更新URL对象的搜索字符串
                            currentUrl.search = searchParams.toString();
                            // 获取当前页面的URL
                            var url = currentUrl;
                            // 执行复制操作
                            copyToClipboard(url);
                        };
                        // 设置span元素的文本内容
                        newBtn.textContent = '分享结果';
                        // 将新的span元素添加到.opt-box容器中
                        optBox.appendChild(newBtn);
                    }

                    // 是否隐藏按钮
                    var hideButton = params.get('hideButton');
                    if ((hideButton == null && valid === 'false')
                        || hideButton === 'true') {
                        // 隐藏所有元素
                        var buttons = document.querySelectorAll('.btn.pre-btn, .btn.next-btn');
                        buttons.forEach(function(button) {
                            button.style.display = 'none';
                        });
                    }
                }
            }
        });
    }

    // 复制当前地址
    function copyToClipboard(textToCopy) {
        // navigator clipboard 需要https等安全上下文
        if (navigator.clipboard && window.isSecureContext) {
            // navigator clipboard 向剪贴板写文本
            return navigator.clipboard.writeText(textToCopy)
                .then(() => {alert("链接已复制到剪贴板");});
        } else {
            // 创建text area
            let textArea = document.createElement("textarea");
            textArea.value = textToCopy;
            // 使text area不在viewport，同时设置不可见
            textArea.style.position = "absolute";
            textArea.style.opacity = 0;
            textArea.style.left = "-999999px";
            textArea.style.top = "-999999px";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            return new Promise((res, rej) => {
                // 执行复制命令并移除文本框
                document.execCommand('copy') ? res() : rej();
                textArea.remove();
                alert("链接已复制到剪贴板");
            });
        }
    }

    // showBlink函数用于显示闪烁的文字。
    // 它首先设置奖品信息，隐藏图片，显示列表，然后创建与data.count相等数量的span元素。
    function showBlink(data) {
        disc.innerHTML = data.prizeTierName + ' ' + data.name + ' ' + data.prizeAmount + '份'
        image.style.display = 'none'
        list.style.display = 'block'
        list.className = ''
        while (list.hasChildNodes()) {
            list.removeChild(list.firstChild)
        }
        var spans = []
        for (var i = 0; i < data.prizeAmount; ++i) {
            var span = document.createElement('span')
            list.appendChild(span)
            spans.push(span)
        }

        // doBlink函数用于实现文字的闪烁效果，通过window.requestAnimationFrame来循环调用。
        function doBlink() {
            if (state == 'showBlink') {
                // Math.random() 生成一个 [0, 1) 范围内的伪随机数，
                // 所以表达式的结果将在 (-0.5, 0.5] 范围内，这会导致 names 数组的元素随机排序。
                names.sort(function(a, b) {
                    return 0.5 - Math.random()
                })
                // 只展示当前奖项个数的随机人名
                for (var i = 0; i < data.prizeAmount; ++i) {
                    spans[i].innerHTML = names[i].userName
                }
                window.requestAnimationFrame(doBlink)
            }
        }

      // 告诉浏览器——你希望执行一个动画，并且要求浏览器在下次重绘之前调用指定的回调函数更新动画。
      window.requestAnimationFrame(doBlink)
    }

    // 通过后端展示奖品维度中奖者，主要是防止页面刷新后前端临时名单丢失
    function showWinnerListWithPrize(data) {
        $.ajax({
            url: '/winning-records/show',
            type: 'POST',
            dataType: 'json',
            contentType: 'application/json',
            headers: {
                'user_token': userToken
            },
            data: JSON.stringify({activityId: activityId, prizeId: data.prizeId}),
            success: function(result) {
                if (result.code != 200) {
                    alert("查询中奖记录失败！" + result.message);
                    return;
                }

                // 中奖名单直接以后端中奖记录为准，不依赖抽奖池 names
                var luckRecords = result.data || []
                data.list = luckRecords.map(function(record) {
                    return {
                        userId: record.winnerId,
                        userName: record.winnerName
                    };
                });

                // names 只负责后续抽奖池，这里同步移除已经中奖的人
                var winnerIds = data.list.map(function(item) {
                    return item.userId;
                });
                names = (names || []).filter(function(item) {
                    return winnerIds.indexOf(item.userId) === -1;
                });

                for (var i = 0; i < data.list.length; ++i) {
                    var span = document.createElement('span')
                    span.innerHTML = data.list[i].userName
                    list.appendChild(span)
                }
            }
        });
    }

    // showList函数用于显示静态的文字列表。它设置奖品信息，隐藏图片，显示列表，并将data.list中的数据添加到列表中。
    function showList(data) {
        disc.innerHTML = data.prizeTierName + ' ' + data.name + ' ' + data.prizeAmount + '份'
        image.style.display = 'none'
        list.style.display = 'block'
        while (list.hasChildNodes()) {
            list.removeChild(list.firstChild)
        }

        // data.list是前端保存的临时数据，若当前抽奖页刷新，则数据丢失
        // 因此判断一下是否为空，为空需要查询后端
        data.list = data.list || []
        if (data.list.length > 0) {
            for (var i = 0; i < data.list.length; ++i) {
                var span = document.createElement('span')
                span.innerHTML = data.list[i].userName
                list.appendChild(span)
            }
        } else {
            showWinnerListWithPrize(data)
        }
    }

    // 第一个奖项没有上一奖项，按钮隐藏；后续奖项显示
    function updatePrevButton() {
        var prevButton = document.querySelector('.btn.pre-btn');
        if (!prevButton) {
            return;
        }
        prevButton.style.display = step > 0 ? '' : 'none';
    }

    // 这是改变next-btn按钮文本的函数
    function changeNextButtonText(text) {
        var nextButton = document.querySelector('.btn.next-btn');
        nextButton.textContent = text;
    }

    // 进入奖项时直接渲染当前奖项：已抽完显示结果，未抽完显示抽奖按钮
    function renderCurrentStep() {
        updatePrevButton();

        // step 越界表示所有奖项已完成，展示总中奖名单
        if (step >= steps.length) {
            showRecords();
            changeNextButtonText('已全部抽完');
            return;
        }

        var data = steps[step];

        // 已抽完奖项不再展示奖品图，直接展示中奖结果
        if (!data.valid) {
            state = 'showList';
            showList(data);
            changeNextButtonText(step < steps.length - 1 ? '查看下一奖项' : '已全部抽完');
            return;
        }

        // 未抽完奖项展示奖品图和抽奖入口
        state = 'showPic';
        showPic(data);
        changeNextButtonText('开始抽奖');
    }

    // 重新进入抽奖页时定位到第一个仍待抽取的奖项，避免从已抽完奖项重新走抽奖流程
    function initDrawStep() {
        var firstPending = -1;
        var nextButton = document.querySelector('.btn.next-btn');

        // 同步状态时先恢复按钮可点击，避免上一次提交遗留的禁用态
        if (nextButton) {
            nextButton.style.pointerEvents = '';
        }

        // 遍历奖品快照，找到第一个后端仍标记为可抽奖的奖品
        for (var i = 0; i < steps.length; ++i) {
            if (steps[i].valid) {
                firstPending = i;
                break;
            }
        }

        // 全部抽完时进入结果页；否则从当前奖项开始
        step = firstPending >= 0 ? firstPending : steps.length;
        renderCurrentStep();
    }

    // 后端状态变化时重新拉取活动详情，并定位到当前可抽奖奖项
    function syncActivityFromServer() {
        reloadConf(initDrawStep)
    }

    // 提交成功后先本地扣人，避免下一轮重复选中同一批人
    function reservePendingWinners(data, luck) {
        var ids = luck.map(function(item) {
            return item.userId;
        });

        names = (names || []).filter(function(item) {
            return ids.indexOf(item.userId) === -1;
        });
        data.valid = false;
        data.pending = true;
        data.list = luck.slice();
    }

    // 后台任务失败后把人员放回候选池，便于重新抽奖
    function releasePendingWinners(data, luck) {
        var existingIds = (names || []).map(function(item) {
            return item.userId;
        });
        var restored = luck.filter(function(item) {
            return existingIds.indexOf(item.userId) === -1;
        });

        names = (names || []).concat(restored);
        data.valid = true;
        data.pending = false;
        data.list = [];
    }

    // 抽奖任务已受理后进入下一奖项；如果用户已经离开当前奖项，只同步本地状态
    function goNextStepAfterSubmit(submitStep) {
        if (step !== submitStep) {
            return;
        }

        if (step < steps.length - 1) {
            ++step;
            renderCurrentStep();
        } else {
            state = 'showList';
            changeNextButtonText('已提交，等待结果');
            document.querySelector('.btn.next-btn').style.pointerEvents = 'none';
        }
    }

    // 构造抽奖请求体；中奖人只提交 id 和展示名，最终状态以后端为准
    function buildDrawPrizeData(data, luck) {
        var luckUserList = luck.map(function(item) {
            return {
                userId: item.userId,
                userName: item.userName
            }
        })

        return {
            activityId: activityId,
            prizeId: data.prizeId,
            winnerList: luckUserList
        };
    }

    // 提交抽奖任务；拿到 requestId 后立即回调，不等待后台抽奖结果
    function submitDrawRequest(drawPrizesData, onAccepted, onRejected) {
        // 发送AJAX请求，成功后再更新页面状态
        $.ajax({
            url: '/draw-prize',
            type: 'POST',
            dataType: 'json',
            contentType: 'application/json',
            headers: {
                'user_token': userToken
            },
            data: JSON.stringify(drawPrizesData),
            success: function(result) {
                if (result.code != 200) {
                    onRejected((result && result.message) || '抽奖失败', result && result.code);
                    return;
                }
                var requestId = result.data && result.data.requestId;
                if (!requestId) {
                    onRejected('抽奖请求未返回任务编号');
                    return;
                }
                onAccepted(requestId);
            },
            error:function(err){
                console.log(err);
                if(err!=null && err.status==401){
                    alert("用户未登录, 即将跳转到登录页!");
                    // 已经被拦截器拦截了, 未登录
                    location.href ="/blogin.html";
                    return;
                }
                if (err != null && err.status == 403) {
                    onRejected('没有抽奖权限');
                    return;
                }
                onRejected('网络异常，请稍后重试');
            }
        });
    }

    // 兼容旧调用名：只负责提交，不再等待轮询成功
    function saveLuck(data, luck, onAccepted, onRejected) {
        submitDrawRequest(buildDrawPrizeData(data, luck), onAccepted, onRejected);
    }

    // 后台轮询抽奖任务状态；不阻塞用户进入下一轮
    function startPollDrawStatus(requestId) {
        var task = pendingTasks[requestId]
        if (!task) {
            return
        }

        queryDrawStatus(task)
    }

    // 查询一次抽奖任务状态，并按终态/非终态决定下一步
    function queryDrawStatus(task) {
        $.ajax({
            url: '/draw-prize/status',
            type: 'GET',
            dataType: 'json',
            data: { requestId: task.requestId },
            headers: {
                'user_token': userToken
            },
            success: function(result) {
                handleDrawStatusResponse(task, result)
            },
            error: function(err) {
                handleDrawStatusError(task, err)
            }
        });
    }

    // 处理抽奖状态查询成功响应；PENDING/PROCESSING 会继续重试
    function handleDrawStatusResponse(task, result) {
        if (result.code != 200) {
            handleTaskFailure(task, (result && result.message) || '查询抽奖结果失败', result && result.code)
            return
        }

        var statusData = result.data
        if (statusData.status === 'SUCCESS') {
            handleTaskSuccess(task, statusData)
            return
        }
        if (statusData.status === 'FAILED') {
            handleTaskFailure(task, statusData.errorMessage || '抽奖失败', statusData.errorCode)
            return
        }

        task.attempts++
        if (task.attempts >= 60) {
            handleTaskFailure(task, '抽奖处理超时，请稍后刷新查看结果')
            return
        }
        task.timer = setTimeout(function() { queryDrawStatus(task) }, 1000)
    }

    // 处理抽奖状态查询网络错误；401 跳登录，其它错误有限重试
    function handleDrawStatusError(task, err) {
        console.log(err)
        if (err != null && err.status == 401) {
            alert("用户未登录, 即将跳转到登录页!");
            location.href = "/blogin.html";
            return
        }
        if (err != null && err.status == 403) {
            handleTaskFailure(task, '没有查询抽奖结果的权限')
            return
        }

        task.attempts++
        if (task.attempts < 60) {
            task.timer = setTimeout(function() { queryDrawStatus(task) }, 1500)
            return
        }
        handleTaskFailure(task, '查询抽奖结果失败，请稍后重试')
    }

    // 后台任务成功时更新对应奖品快照；用户已离开该奖项时只更新内存状态
    function handleTaskSuccess(task, statusData) {
        clearTimeout(task.timer)
        delete pendingTasks[task.requestId]

        var winners = statusData && statusData.winnerList
            && statusData.winnerList.length > 0
            ? statusData.winnerList : task.luck
        task.data.pending = false
        task.data.valid = false
        task.data.list = winners.slice()

        if (steps[step] === task.data) {
            state = 'showList'
            showList(task.data)
            changeNextButtonText(step < steps.length - 1 ? '已抽完，下一步' : '已全部抽完')
            document.querySelector('.btn.next-btn').style.pointerEvents = ''
        } else if (Object.keys(pendingTasks).length === 0 && step >= steps.length) {
            showRecords()
            changeNextButtonText('已全部抽完')
            document.querySelector('.btn.next-btn').style.pointerEvents = ''
        }
    }

    // 后台任务失败时释放本地扣住的人员，并提示用户
    function handleTaskFailure(task, message, code) {
        clearTimeout(task.timer)
        delete pendingTasks[task.requestId]

        // 已抽取或顺序错误说明前端状态落后于后端，需要重新同步活动详情
        if (code === 1049 || code === 1056) {
            syncActivityFromServer()
            return
        }

        releasePendingWinners(task.data, task.luck)

        if (steps[step] === task.data) {
            state = 'showBlink'
            showBlink(task.data)
            changeNextButtonText('点我确定')
            document.querySelector('.btn.next-btn').style.pointerEvents = ''
        }
        alert('抽奖失败！' + message)
    }

    // 展示本次选中的候选人，并标明结果仍在处理中
    function showPendingWinners(data, luck) {
        disc.innerHTML = data.prizeTierName + ' ' + data.name + ' ' + data.prizeAmount + '份'
        image.style.display = 'none'
        list.style.display = 'block'
        list.className = ''
        while (list.hasChildNodes()) {
            list.removeChild(list.firstChild)
        }
        for (var i = 0; i < luck.length; ++i) {
            var span = document.createElement('span')
            span.innerHTML = luck[i].userName + '（待确认）'
            list.appendChild(span)
        }
    }

    // 提交当前奖项；拿到 requestId 后立即本地扣人并进入下一轮
    function submitCurrentPrize(data) {
        // 只防止同一个奖品重复提交；不同奖品可以连续提交，由后台按队列顺序处理
        if (data.submitting) {
            return
        }
        if (!names || names.length < data.prizeAmount) {
            alert('剩余可抽奖人数不足')
            return
        }

        // 先取候选人，提交成功后再本地扣人，避免失败时名单不可恢复
        var luck = names.slice(0, data.prizeAmount)
        var submitStep = step
        var nextButton = document.querySelector('.btn.next-btn')

        data.list = luck.slice()
        data.submitting = true
        nextButton.style.pointerEvents = 'none'
        showPendingWinners(data, luck)
        changeNextButtonText('抽奖处理中...')

        // 投递异步抽奖任务；拿到 requestId 后立即进入下一轮，不等待 SUCCESS
        saveLuck(data, luck, function(requestId) {
            handleDrawAccepted(data, luck, requestId, submitStep, nextButton)
        }, function(message, code) {
            handleDrawRejected(data, message, code, nextButton)
        })
    }

    // 抽奖任务受理后：记录待确认人员，并让页面继续下一轮
    function handleDrawAccepted(data, luck, requestId, submitStep, nextButton) {
        reservePendingWinners(data, luck)
        pendingTasks[requestId] = {
            requestId: requestId,
            data: data,
            luck: luck,
            timer: null,
            attempts: 0
        }
        startPollDrawStatus(requestId)

        data.submitting = false
        nextButton.style.pointerEvents = ''
        goNextStepAfterSubmit(submitStep)
    }

    // 抽奖任务提交失败：状态落后时同步后端，普通失败时回到当前奖项重试
    function handleDrawRejected(data, message, code, nextButton) {
        data.submitting = false
        nextButton.style.pointerEvents = ''
        data.list = []

        // 后端已经抽过或顺序变化时，重新同步状态，不再让用户反复点同一个奖品
        if (code === 1049 || code === 1056) {
            syncActivityFromServer()
            return
        }

        state = 'showBlink'
        showBlink(data)
        changeNextButtonText('点我确定')
        alert('抽奖失败！' + message)
    }

    // nextStep函数用于根据当前状态显示下一个步骤的内容。
    // 它根据state的值和data.list的长度来决定是显示图片、闪烁文字还是静态文字列表，并更新step和state。
    function nextStep() {
        // 每次进入新步骤先同步“查看上一奖项”按钮状态
        updatePrevButton()

        // step 越界说明已经到最终结果页，统一交给 renderCurrentStep 处理
        if (step >= steps.length) {
            renderCurrentStep()
            return
        }

        var data = steps[step]
        console.log("steps[" + step + "]:" + JSON.stringify(data))
        if (state == 'showPic') {
            if (data.valid) {
                // 还没抽：抽奖
                state = 'showBlink'
                showBlink(data)
                changeNextButtonText('点我确定')
            } else {
                // 抽过了：展示
                state = 'showList'
                showList(data)
                changeNextButtonText('已抽完，下一步')
            }
        } else if (state == 'showBlink') {
            submitCurrentPrize(data)
        } else if (state == 'showList') {
            if (step < (steps.length - 1)) {
                ++step
                renderCurrentStep()
            } else {
                // 最后一个奖项仍有后台任务时，不提前展示最终名单，等 SUCCESS 后再刷新
                if (Object.keys(pendingTasks).length > 0) {
                    return
                }
                // 抽奖结束，展示全量中奖列表
                if (step == (steps.length - 1)) {
                    ++step
                }
                showRecords()
                changeNextButtonText('已全部抽完')
            }
        } else {
            renderCurrentStep()
        }
    }

    // previousStep函数用于返回到上一个奖项，并直接渲染该奖项的结果或抽奖入口
    function previousStep() {
        if (step > 0) {
            --step
        }
        renderCurrentStep()
    }

    // 抽奖页面加载逻辑
    function drawPage() {
        // 判断活动是否有效:进行中
        if (valid == "true") {
            // 判断是用户还是管理员，只有管理员有权限抽奖
            var identity = localStorage.getItem("user_identity");
            if (identity == "ADMIN") {
                // 页面加载完成后读取最新活动详情，并定位到第一个仍待抽取的奖项
                reloadConf(initDrawStep)
            } else {
                alert("抽奖未结束，由于您不是管理员，无权限限参与抽奖。请耐心等待抽奖结束后查看中奖名单");
            }
        } else {
            showRecords()
        }
    }

    // reloadConf函数用于重新加载活动详情。抽奖页默认读取最新状态，避免旧缓存导致死循环。
    // 如果提供了回调函数func，则在文件读取完成后调用它。
    function reloadConf(func) {
        // 发送AJAX请求
        $.ajax({
            url: '/activity/detail',
            type: 'GET',
            data: { activityId: activityId, fresh: true },
            dataType: 'json',
            headers: {
                'user_token': userToken
            },
            success: function(result) {
                if (result.code != 200) {
                    alert("获取活动详情失败！" + result.message);
                } else {
                    names = result.data.users;
                    steps = result.data.prizes;
                    if (func) func();
                }
            },
            error:function(err){
                console.log(err);
                if(err!=null && err.status==401){
                    alert("用户未登录, 即将跳转到登录页!");
                    // 已经被拦截器拦截了, 未登录
                    location.href ="/blogin.html";
                }
            }
        });
    }

    // 抽奖页起始逻辑
    drawPage()
</script>
</body>
</html>
