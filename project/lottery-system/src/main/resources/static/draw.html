<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <title>抽奖页面</title>
    <style type="text/css">
        * {
            margin: 0;
            padding: 0;
        }
        html, body {
            width: 100%;
            height: 100%;
        }
        body {
            text-align: center;
            background: url("./pic/bg.png") no-repeat;
            overflow: hidden;
            background-size: 100% 100%;
            font-weight: bold;
            color: #D40000;
        }
        /*
         * 页面使用纵向 flex 布局：奖品图固定高度，中奖名单占满剩余空间。
         * 按钮容器固定在浏览器可视区域底部，避免小窗口时按钮被顶到屏幕外，
         * 也避免长用户名换行时把按钮上下顶动。
         */
        #container {
            min-width: 1000px;
            height: 100vh;
            min-height: 0;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 110px;
        }
        /* 字号按原设计的约 67% 缩小，避免小窗口下挤占名单区域 */
        #title {
            font-size: 67px;
            margin-top: 48px;
        }
        #disc {
            font-size: 27px;
            margin: 8px 0;
        }
        #image {
            flex: 0 0 auto;
            margin-top: 14px;
            max-height: 188px;
            max-width: 70%;
            object-fit: contain;
            border: 1px solid #E23540FF;
            border-radius: 14px;
        }
        #list {
            flex: 1 1 auto;
            min-height: 0;
            width: 100%;
            max-width: 800px;
            box-sizing: border-box;
            margin: 8px auto 0;
            overflow-y: auto;
            scrollbar-gutter: stable;
        }
        /*
         * 中奖名单、闪烁名单、待确认名单统一一行一个人名。
         * 固定块级宽度并省略溢出，长昵称只占自己这一行，不会覆盖相邻行。
         */
        #list .name-row {
            display: block;
            width: 100%;
            box-sizing: border-box;
            padding: 0 12px;
            font-size: 24px;
            line-height: 1.6;
            margin: 4px 0;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        #list .pending-row {
            color: #999999;
        }
        #list .blink-row {
            color: #D40000;
            letter-spacing: 2px;
        }
        .records-item {
            text-align: center;
            cursor: pointer;
            padding: 12px;
            font-size: 14px;
        }
        .records-row {
            display: block;
            width: 100%;
            box-sizing: border-box;
            padding: 0 12px;
            margin: 4px 0;
            line-height: 1.6;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        /* 操作区固定在可视页面底部，不参与名单高度变化 */
        .opt-box{
            position: fixed;
            left: 0;
            right: 0;
            bottom: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            z-index: 10;
        }
        .opt-box .btn{
            width: 120px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #D40000;
            margin-inline: 18px;
            cursor: pointer;
            border-radius: 4px;
            font-weight: normal;
            font-size: 15px;
        }
        .opt-box .btn:hover{
            background-color: #D40000;
            color: #fff;
        }
    </style>
</head>

<body>
<div id="container">
    <div id="title"></div>
    <div id="disc"></div>
    <img id="image" />
    <div id="list"></div>
    <div class="opt-box">
        <span class="btn pre-btn" onclick="previousStep()" style="display:none">查看上一奖项</span>
        <span class="btn next-btn" onclick="nextStep()">开始抽奖</span>
    </div>
</div>
<script src="./js/jquery.min.js"></script>
<script src="./js/auth.js"></script>
<script>

    var params = new URLSearchParams(window.location.search);
    var activityId = params.get('activityId');
    var valid = params.get('valid');
    var userToken = localStorage.getItem("user_token");

    // 获取网页上通过 id 为 disc、image 和 list 的 DOM 元素引用
    var disc = document.getElementById('disc')
    var image = document.getElementById('image')
    var list = document.getElementById('list')

    // 奖品列表；每个奖品包含中奖名单 list 和本地待确认名单 pendingList
    var steps = null
    // 当前抽到第几个奖品
    var step = 0
    // 剩余候选人员
    var names = null
    // 当前页面状态：idle/blink/drawing/waiting/done/records
    var state = ''
    // 已提交但尚未确认结果的抽奖任务，key 为 requestId
    var pendingTasks = {}
    // 两次抽奖点击的最小间隔，防止手滑连点产生并发请求
    var CLICK_INTERVAL_MS = 500
    // 上一次被接受的点击时间
    var lastClickAt = 0
    // 用于取消过期的闪烁动画
    var blinkToken = 0

    // 等待 DOM 加载完成
    document.addEventListener('DOMContentLoaded', function() {
        var titleDiv = document.getElementById('title');
        var activityName = params.get('activityName');
        titleDiv.textContent = activityName;
    });

    function formatDate(dateString) {
        var date = new Date(dateString);
        var hour = ('0' + date.getHours()).slice(-2);
        var minute = ('0' + date.getMinutes()).slice(-2);
        var second = ('0' + date.getSeconds()).slice(-2);
        return hour + ':' + minute + ':' + second;
    }

    // 清空名单区域
    function clearList() {
        while (list.hasChildNodes()) {
            list.removeChild(list.firstChild)
        }
    }

    // 追加一行姓名，保证一行只显示一个人名
    function appendNameRow(text, extraClass) {
        var row = document.createElement('div')
        row.className = 'name-row' + (extraClass ? ' ' + extraClass : '')
        row.textContent = text
        list.appendChild(row)
        return row
    }

    // 显示奖品图片；抽奖前、抽奖中、抽奖后都保留图片
    function showPrizeImage(data) {
        image.src = data.imageUrl ? data.imageUrl : '/pic/defaultPrizeImg.png'
        image.style.display = 'inline'
    }

    // 奖品标题显示当前抽取进度
    function buildPrizeTitle(data) {
        var done = (data.list || []).length
        return data.prizeTierName + ' ' + data.name + ' 已抽 ' + done + '/' + data.prizeAmount + ' 份'
    }

    // 初始化奖品的前端状态容器
    function ensurePrizeState(data) {
        data.list = data.list || []
        data.pendingList = data.pendingList || []
    }

    // 奖品是否已经抽满；后端 valid=false 或本中奖名单达到数量都算抽满
    function isPrizeFinished(data) {
        if (!data) {
            return true
        }
        if (!data.valid) {
            return true
        }
        return (data.list || []).length >= data.prizeAmount
    }

    // 当前奖品还能再抽几个人；待确认任务也占用名额
    function remainingOf(data) {
        var done = (data.list || []).length + (data.pendingList || []).length
        return Math.max(0, data.prizeAmount - done)
    }

    // 渲染当前奖品：奖品图 + 中奖名单 + 待确认名单
    function renderPrize(data) {
        showPrizeImage(data)
        disc.textContent = buildPrizeTitle(data)
        list.style.display = 'block'
        list.className = 'prize-list'
        clearList()

        var i
        for (i = 0; i < (data.list || []).length; i++) {
            appendNameRow(data.list[i].userName)
        }
        for (i = 0; i < (data.pendingList || []).length; i++) {
            appendNameRow(data.pendingList[i].userName + '（待确认）', 'pending-row')
        }
    }

    // 设置底部主按钮的文案和可点击状态
    function setNextButton(text, enabled) {
        var nextButton = document.querySelector('.btn.next-btn')
        nextButton.textContent = text
        nextButton.style.pointerEvents = enabled ? '' : 'none'
        nextButton.style.opacity = enabled ? '1' : '0.6'
    }

    // 当前闪烁行显示的人；用户点击确定时就是他中奖
    var blinkCandidate = null

    // 从剩余候选人中随机取一个人，尽量避免连续两次显示同一个人
    function pickCandidate() {
        if (!names || names.length === 0) {
            return null
        }
        var index = Math.floor(Math.random() * names.length)
        if (names.length > 1 && blinkCandidate
            && names[index].userId === blinkCandidate.userId) {
            index = (index + 1) % names.length
        }
        return names[index]
    }

    // 闪烁动画的刷新间隔，太快会看不清名字
    var BLINK_REFRESH_MS = 60
    // 当前闪烁动画的计时器
    var blinkTimer = null

    // 停止闪烁动画，避免切换状态后继续刷新旧行
    function stopBlink() {
        if (blinkTimer !== null) {
            clearInterval(blinkTimer)
            blinkTimer = null
        }
    }

    // 只开始滚动，不提交抽奖请求；用户再次点击才真正抽取
    function startBlink(data) {
        blinkToken++
        state = 'blink'
        stopBlink()
        renderPrize(data)

        blinkCandidate = pickCandidate()
        var row = appendNameRow(blinkCandidate ? blinkCandidate.userName : '抽奖中...',
            'blink-row')

        blinkTimer = setInterval(function() {
            if (state !== 'blink') {
                stopBlink()
                return
            }
            blinkCandidate = pickCandidate()
            row.textContent = blinkCandidate ? blinkCandidate.userName : '抽奖中...'
        }, BLINK_REFRESH_MS)
    }

    // 两次有效点击至少间隔 500ms；间隔内的点击直接忽略，不排队也不补发
    function acceptClick() {
        var now = Date.now()
        if (now - lastClickAt < CLICK_INTERVAL_MS) {
            return false
        }
        lastClickAt = now
        return true
    }

    // 展示中奖总名单
    function showRecords() {
        state = 'records'
        stopBlink()
        disc.innerHTML = "中奖名单"
        // 最终名单是整场活动的汇总，没有单个奖品对应，隐藏奖品图避免显示成上一张奖品
        image.style.display = 'none'
        list.style.display = 'block'
        clearList()
        $.ajax({
            url: '/winning-records/show',
            type: 'POST',
            dataType: 'json',
            contentType: 'application/json',
            data: JSON.stringify({activityId: activityId}),
            headers: {
                'user_token': userToken
            },
            success: function(result) {
                if (result.code != 200) {
                    alert("查询中奖记录失败！" + result.message);
                } else {
                    var records = result.data
                    list.className = "records-item"
                    for (var i = 0; i < records.length; ++i) {
                        var item = document.createElement('div')
                        item.className = 'records-row'
                        item.textContent = formatDate(records[i].winningTime) + ' '
                            + records[i].winnerName + ' '
                            + records[i].prizeName + ' '
                            + (records[i].prizeTierName || records[i].prizeTier)
                        list.appendChild(item)
                    }

                    // 分享链接：每个结果页只创建一个分享按钮
                    var optBox = document.querySelector('.opt-box');
                    var existingBtn = optBox.querySelector('.btn.copy-btn');
                    if (!existingBtn) {
                        var newBtn = document.createElement('span');
                        newBtn.className = 'btn copy-btn';
                        newBtn.onclick = function() {
                            var currentUrl = new URL(window.location);
                            var searchParams = currentUrl.searchParams;
                            searchParams.delete('valid');
                            searchParams.append('valid', false);
                            searchParams.delete('hideButton');
                            searchParams.append('hideButton', true);
                            currentUrl.search = searchParams.toString();
                            copyToClipboard(currentUrl);
                        };
                        newBtn.textContent = '分享结果';
                        optBox.appendChild(newBtn);
                    }

                    // 分享结果页隐藏抽奖按钮
                    var hideButton = params.get('hideButton');
                    if ((hideButton == null && valid === 'false')
                        || hideButton === 'true') {
                        var buttons = document.querySelectorAll('.btn.pre-btn, .btn.next-btn');
                        buttons.forEach(function(button) {
                            button.style.display = 'none';
                        });
                    }
                }
            }
        });
    }

    // 复制当前地址
    function copyToClipboard(textToCopy) {
        if (navigator.clipboard && window.isSecureContext) {
            return navigator.clipboard.writeText(textToCopy)
                .then(() => {alert("链接已复制到剪贴板");});
        } else {
            let textArea = document.createElement("textarea");
            textArea.value = textToCopy;
            textArea.style.position = "absolute";
            textArea.style.opacity = 0;
            textArea.style.left = "-999999px";
            textArea.style.top = "-999999px";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            return new Promise((res, rej) => {
                document.execCommand('copy') ? res() : rej();
                textArea.remove();
                alert("链接已复制到剪贴板");
            });
        }
    }

    // 第一个奖项没有上一奖项，按钮隐藏
    function updatePrevButton() {
        var prevButton = document.querySelector('.btn.pre-btn');
        if (!prevButton) {
            return;
        }
        prevButton.style.display = step > 0 ? '' : 'none';
    }

    // 重新进入抽奖页时定位到第一个仍待抽取的奖项
    function initDrawStep() {
        var firstPending = -1;
        for (var i = 0; i < steps.length; ++i) {
            if (!isPrizeFinished(steps[i])) {
                firstPending = i;
                break;
            }
        }
        step = firstPending >= 0 ? firstPending : steps.length;
        renderCurrentStep();
    }

    // 渲染当前奖项：未抽满显示抽奖入口，已抽满显示结果并允许进入下一奖项
    function renderCurrentStep() {
        updatePrevButton();
        blinkToken++
        stopBlink()
        blinkCandidate = null

        if (step >= steps.length) {
            showRecords();
            setNextButton('已全部抽完', false);
            return;
        }

        var data = steps[step];
        ensurePrizeState(data);

        // 已抽满：展示该奖品图和完整中奖名单
        if (isPrizeFinished(data)) {
            state = 'done';
            renderPrize(data);
            setNextButton(step < steps.length - 1 ? '查看下一奖项' : '查看全部中奖名单', true);
            return;
        }

        // 未抽满：展示奖品图和已中奖/待确认名单
        renderPrize(data);
        if (remainingOf(data) <= 0) {
            state = 'waiting';
            setNextButton('等待抽奖结果...', false);
            return;
        }
        state = 'idle';
        setNextButton('抽下一个人', true);
    }

    // 后端状态变化时强制回源数据库并重新定位奖品
    function syncActivityFromServer() {
        reloadConf(initDrawStep, true)
    }

    // 构造抽奖请求体；一次只提交一个中奖人
    function buildDrawPrizeData(data, luck) {
        return {
            activityId: activityId,
            prizeId: data.prizeId,
            winnerList: [{
                userId: luck.userId,
                userName: luck.userName
            }]
        };
    }

    // 提交抽奖任务；拿到 requestId 后立即进入本地待确认状态
    function submitDrawRequest(drawPrizesData, onAccepted, onRejected) {
        $.ajax({
            url: '/draw-prize',
            type: 'POST',
            dataType: 'json',
            contentType: 'application/json',
            headers: {
                'user_token': userToken
            },
            data: JSON.stringify(drawPrizesData),
            success: function(result) {
                if (result.code != 200) {
                    onRejected((result && result.message) || '抽奖失败', result && result.code);
                    return;
                }
                var requestId = result.data && result.data.requestId;
                if (!requestId) {
                    onRejected('抽奖请求未返回任务编号');
                    return;
                }
                onAccepted(requestId);
            },
            error:function(err){
                console.log(err);
                if(err!=null && err.status==401){
                    alert("用户未登录, 即将跳转到登录页!");
                    location.href ="/blogin.html";
                    return;
                }
                if (err != null && err.status == 403) {
                    onRejected('没有抽奖权限');
                    return;
                }
                onRejected('网络异常，请稍后重试');
            }
        });
    }

    // 把一个候选人放进本地待确认名单
    function reservePendingWinner(data, luck) {
        data.pendingList = data.pendingList || []
        data.pendingList.push(luck)
        // names 在点击时已经移除，失败时会放回
    }

    // 任务成功：待确认名单转为正式中奖名单
    function movePendingToWinner(data, luck) {
        data.pendingList = (data.pendingList || []).filter(function(item) {
            return item.userId !== luck.userId
        })
        var exists = (data.list || []).some(function(item) {
            return item.userId === luck.userId
        })
        if (!exists) {
            data.list.push(luck)
        }
        if (data.list.length >= data.prizeAmount) {
            data.valid = false
        }
    }

    // 任务失败：从待确认名单移除，并放回候选池
    function releasePendingWinner(data, luck) {
        data.pendingList = (data.pendingList || []).filter(function(item) {
            return item.userId !== luck.userId
        })
        var exists = (names || []).some(function(item) {
            return item.userId === luck.userId
        })
        if (!exists) {
            names.unshift(luck)
        }
    }

    // 查询一次抽奖任务状态
    function queryDrawStatus(task) {
        $.ajax({
            url: '/draw-prize/status',
            type: 'GET',
            dataType: 'json',
            data: { requestId: task.requestId },
            headers: {
                'user_token': userToken
            },
            success: function(result) {
                handleDrawStatusResponse(task, result)
            },
            error: function(err) {
                handleDrawStatusError(task, err)
            }
        });
    }

    // 处理抽奖状态查询成功响应；PENDING/PROCESSING 会继续重试
    function handleDrawStatusResponse(task, result) {
        if (result.code != 200) {
            handleTaskFailure(task, (result && result.message) || '查询抽奖结果失败', result && result.code)
            return
        }

        var statusData = result.data
        if (statusData.status === 'SUCCESS') {
            handleTaskSuccess(task, statusData)
            return
        }
        if (statusData.status === 'FAILED') {
            handleTaskFailure(task, statusData.errorMessage || '抽奖失败', statusData.errorCode)
            return
        }

        task.attempts++
        if (task.attempts >= 60) {
            handleTaskFailure(task, '抽奖处理超时，请稍后刷新查看结果')
            return
        }
        task.timer = setTimeout(function() { queryDrawStatus(task) }, 1000)
    }

    // 处理抽奖状态查询网络错误；401 跳登录，其它错误有限重试
    function handleDrawStatusError(task, err) {
        console.log(err)
        if (err != null && err.status == 401) {
            alert("用户未登录, 即将跳转到登录页!");
            location.href = "/blogin.html";
            return
        }
        if (err != null && err.status == 403) {
            handleTaskFailure(task, '没有查询抽奖结果的权限')
            return
        }

        task.attempts++
        if (task.attempts < 60) {
            task.timer = setTimeout(function() { queryDrawStatus(task) }, 1500)
            return
        }
        handleTaskFailure(task, '查询抽奖结果失败，请稍后重试')
    }

    // 任务成功时把待确认人员转为正式中奖，并刷新当前奖品展示
    function handleTaskSuccess(task, statusData) {
        clearTimeout(task.timer)
        delete pendingTasks[task.requestId]

        movePendingToWinner(task.data, task.luck)

        // 当前页面仍停在该奖品时直接刷新；否则只更新内存并等待用户回到该奖品
        if (steps[step] === task.data) {
            renderCurrentStep()
        } else if (task.data.list.length >= task.data.prizeAmount) {
            task.data.valid = false
        }

        // 回源刷新后旧任务对象可能已经不在 steps 中，全部完成后重新同步一次
        if (steps.indexOf(task.data) === -1 && Object.keys(pendingTasks).length === 0) {
            syncActivityFromServer()
        }
    }

    // 任务失败时释放本地占用的人员；状态不一致时强制回源
    function handleTaskFailure(task, message, code) {
        clearTimeout(task.timer)
        delete pendingTasks[task.requestId]

        releasePendingWinner(task.data, task.luck)

        if (steps[step] === task.data) {
            renderCurrentStep()
        }

        // 已抽取、顺序错误、名额不足说明前端状态落后于后端
        if (code === 1049 || code === 1056 || code === 1063) {
            syncActivityFromServer()
            return
        }
        alert('抽奖失败！' + message)
    }

    // 第一次点击：只开始滚动，不创建抽奖任务
    function startDraw(data) {
        if (!names || names.length === 0) {
            alert('已没有可抽奖的候选人')
            return
        }
        if (remainingOf(data) <= 0) {
            renderCurrentStep()
            return
        }
        if (!acceptClick()) {
            return
        }

        startBlink(data)
        // 前 500ms 先禁用确定按钮，避免手滑第二次点击立刻提交
        setNextButton('滚动中...', false)
        setTimeout(function() {
            if (state === 'blink') {
                setNextButton('点我确定', true)
            }
        }, CLICK_INTERVAL_MS)
    }

    // 第二次点击：停止滚动，当前显示的人中奖，并提交一次抽奖请求
    function confirmDraw(data) {
        if (!acceptClick()) {
            return
        }
        if (!blinkCandidate) {
            renderCurrentStep()
            syncActivityFromServer()
            return
        }

        // 先同步进入 drawing 并停止动画，双击时第二次点击会被状态判断拦掉
        var luck = blinkCandidate
        stopBlink()
        state = 'drawing'
        setNextButton('抽奖中...', false)

        // 中奖人从候选池移除，失败时再放回
        var index = -1
        for (var i = 0; i < names.length; ++i) {
            if (names[i].userId === luck.userId) {
                index = i
                break
            }
        }
        if (index >= 0) {
            names.splice(index, 1)
        }

        submitDrawRequest(buildDrawPrizeData(data, luck), function(requestId) {
            reservePendingWinner(data, luck)
            pendingTasks[requestId] = {
                requestId: requestId,
                data: data,
                luck: luck,
                timer: null,
                attempts: 0
            }
            renderPrize(data)
            // 任务未结束前继续保持禁用，保证同一时间只有一个在途请求
            setNextButton('等待抽奖结果...', false)
            queryDrawStatus(pendingTasks[requestId])
        }, function(message, code) {
            var exists = (names || []).some(function(item) {
                return item.userId === luck.userId
            })
            if (!exists) {
                names.unshift(luck)
            }
            renderCurrentStep()
            if (code === 1049 || code === 1056 || code === 1063) {
                syncActivityFromServer()
                return
            }
            alert('抽奖失败！' + message)
        })
    }

    // 主按钮：第一次点击开始滚动，第二次点击确定中奖人，抽满后进入下一奖项
    function nextStep() {
        updatePrevButton()
        if (!steps) {
            return
        }

        // 滚动中再次点击表示确定当前显示的人
        if (state === 'blink') {
            confirmDraw(steps[step])
            return
        }
        // 请求在途或等待结果时不允许再次抽奖，避免并发
        if (state === 'drawing' || state === 'waiting') {
            return
        }

        if (step >= steps.length) {
            renderCurrentStep()
            return
        }

        var data = steps[step]
        ensurePrizeState(data)

        if (isPrizeFinished(data)) {
            step = step < steps.length - 1 ? step + 1 : steps.length
            renderCurrentStep()
            return
        }

        startDraw(data)
    }

    // 返回上一奖项；滚动中或请求在途时不允许切换
    function previousStep() {
        if (state === 'blink' || state === 'drawing' || state === 'waiting') {
            return
        }
        if (step > 0) {
            --step
        }
        renderCurrentStep()
    }

    // 抽奖页面加载逻辑
    function drawPage() {
        if (valid == "true") {
            var identity = localStorage.getItem("user_identity");
            if (identity == "ADMIN") {
                // 优先读取 Redis 中的活动详情；只有异常恢复时才强制回源
                reloadConf(initDrawStep)
            } else {
                alert("抽奖未结束，由于您不是管理员，无权限限参与抽奖。请耐心等待抽奖结束后查看中奖名单");
            }
        } else {
            showRecords()
        }
    }

    // 回源后把未完成任务的本地占位重新合并进来，避免重复抽到同一批人
    function applyPendingReservations() {
        var pendingIds = {}
        Object.keys(pendingTasks).forEach(function(requestId) {
            var task = pendingTasks[requestId]
            if (!task || !task.luck) {
                return
            }
            pendingIds[task.luck.userId] = true

            var prize = null
            for (var i = 0; i < steps.length; ++i) {
                if (steps[i].prizeId === task.data.prizeId) {
                    prize = steps[i]
                    break
                }
            }
            if (!prize) {
                return
            }
            prize.pendingList = prize.pendingList || []
            var alreadyWinner = (prize.list || []).some(function(item) {
                return item.userId === task.luck.userId
            })
            var alreadyPending = prize.pendingList.some(function(item) {
                return item.userId === task.luck.userId
            })
            if (!alreadyWinner && !alreadyPending) {
                prize.pendingList.push(task.luck)
            }
        })

        names = (names || []).filter(function(item) {
            return !pendingIds[item.userId]
        })
    }

    // 加载活动详情；forceFresh=true 时跳过 Redis 直接回源数据库
    function reloadConf(func, forceFresh) {
        var query = { activityId: activityId }
        if (forceFresh === true) {
            query.fresh = true
        }

        $.ajax({
            url: '/activity/detail',
            type: 'GET',
            data: query,
            dataType: 'json',
            headers: {
                'user_token': userToken
            },
            success: function(result) {
                if (result.code != 200) {
                    alert("获取活动详情失败！" + result.message);
                } else {
                    names = result.data.users;
                    steps = result.data.prizes;
                    applyPendingReservations();
                    if (func) func();
                }
            },
            error:function(err){
                console.log(err);
                if(err!=null && err.status==401){
                    alert("用户未登录, 即将跳转到登录页!");
                    location.href ="/blogin.html";
                }
            }
        });
    }

    // 抽奖页起始逻辑
    drawPage()
</script>
</body>
</html>
