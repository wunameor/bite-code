<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>忘记密码</title>
  <link rel="stylesheet" href="./css/bootstrap.min.css">
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/login.css">
  <link rel="stylesheet" href="./css/toastr.min.css">
  <style>
    .forgot-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f7fb;
    }
    .forgot-card {
      width: 420px;
      padding: 32px 30px;
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
    }
    .forgot-title {
      margin-bottom: 8px;
      font-size: 22px;
      font-weight: 600;
      color: #222222;
    }
    .forgot-desc {
      margin-bottom: 22px;
      font-size: 14px;
      color: #777777;
    }
    .forgot-actions {
      display: flex;
      gap: 12px;
      margin-top: 8px;
    }
    .forgot-actions .btn {
      flex: 1;
    }
    .back-login {
      margin-top: 16px;
      text-align: center;
      font-size: 14px;
    }
  </style>
</head>
<body class="forgot-page">
<div class="forgot-card">
  <div class="forgot-title">忘记密码</div>
  <div class="forgot-desc">输入用户名或邮箱，系统会向该账号绑定的邮箱发送重置验证码。</div>

  <form id="resetPasswordForm" method="post">
    <div class="form-group">
      <label for="resetAccount">用户名 / 邮箱</label>
      <input class="form-control" type="text" id="resetAccount" name="account"
             placeholder="请输入用户名或邮箱" autocomplete="username" required>
    </div>

    <div class="form-group">
      <label for="resetEmailCode">邮箱验证码</label>
      <div class="code-box">
        <input class="form-control" type="text" id="resetEmailCode" name="emailCode"
               placeholder="请输入 6 位验证码" inputmode="numeric" maxlength="6"
               autocomplete="one-time-code" required>
        <button type="button" class="btn btn-primary" id="getResetCodeBtn">获取验证码</button>
      </div>
    </div>

    <div class="form-group">
      <label for="newPassword">新密码</label>
      <input class="form-control" type="password" id="newPassword" name="newPassword"
             placeholder="6-12 位字母或数字" autocomplete="new-password" required>
    </div>

    <div class="form-group">
      <label for="confirmPassword">确认新密码</label>
      <input class="form-control" type="password" id="confirmPassword" name="confirmPassword"
             placeholder="请再次输入新密码" autocomplete="new-password" required>
    </div>

    <div class="forgot-actions">
      <button type="button" class="btn btn-secondary" onclick="location.href='/blogin.html'">返回登录</button>
      <button type="submit" class="btn btn-primary">重置密码</button>
    </div>
  </form>

  <div class="back-login">
    想起密码了？<a href="/blogin.html">返回登录</a>
  </div>
</div>

<script src="./js/jquery.min.js"></script>
<script src="./js/jquery.validate.min.js"></script>
<script src="./js/bootstrap.min.js"></script>
<script src="./js/toastr.min.js"></script>
<script>
  // 优先用 toastr，第三方库异常时退回 alert
  if (window.toastr) {
    toastr.options = {
      closeButton: true,
      progressBar: true,
      timeOut: 3000,
      positionClass: 'toast-top-center'
    };
  }

  function notifySuccess(message) {
    window.toastr ? toastr.success(message) : alert(message);
  }

  function notifyError(message) {
    window.toastr ? toastr.error(message) : alert(message);
  }

  // 验证码按钮倒计时，和后端 60 秒限流保持一致
  function startCountdown(seconds) {
    var remain = seconds;
    var $btn = $('#getResetCodeBtn');
    $btn.prop('disabled', true).text(remain + ' 秒后重发');

    var timer = setInterval(function () {
      remain--;
      if (remain <= 0) {
        clearInterval(timer);
        $btn.prop('disabled', false).text('获取验证码');
        return;
      }
      $btn.text(remain + ' 秒后重发');
    }, 1000);
  }

  // 发送重置密码验证码
  function sendResetCode() {
    var account = $('#resetAccount').val().trim();
    if (!account) {
      notifyError('请输入用户名或邮箱');
      return;
    }

    var $btn = $('#getResetCodeBtn');
    $btn.prop('disabled', true).text('发送中...');

    $.ajax({
      url: '/user/email-code',
      type: 'post',
      contentType: 'application/json',
      dataType: 'json',
      data: JSON.stringify({
        scene: 'RESET_PASSWORD',
        account: account
      }),
      success: function (result) {
        if (result.code !== 200) {
          notifyError(result.message || '验证码发送失败');
          $btn.prop('disabled', false).text('获取验证码');
          return;
        }

        notifySuccess('验证码已发送，请注意查收');
        startCountdown(60);
      },
      error: function (xhr) {
        if (xhr.status === 400 || xhr.status === 401 || xhr.status === 403) {
          notifyError('验证码发送失败，请检查账号');
        } else {
          notifyError('验证码发送失败：' + xhr.status);
        }
        $btn.prop('disabled', false).text('获取验证码');
      }
    });
  }

  // 提交重置密码
  function submitResetPassword() {
    var account = $('#resetAccount').val().trim();
    var emailCode = $('#resetEmailCode').val().trim();
    var newPassword = $('#newPassword').val();
    var confirmPassword = $('#confirmPassword').val();

    if (!account) {
      notifyError('请输入用户名或邮箱');
      return;
    }
    if (!/^\d{6}$/.test(emailCode)) {
      notifyError('验证码必须是 6 位数字');
      return;
    }
    if (!/^[0-9A-Za-z]{6,12}$/.test(newPassword)) {
      notifyError('密码必须是 6-12 位字母或数字');
      return;
    }
    if (newPassword !== confirmPassword) {
      notifyError('两次输入的新密码不一致');
      return;
    }

    var $submitBtn = $('#resetPasswordForm button[type=submit]');
    $submitBtn.prop('disabled', true).text('提交中...');

    $.ajax({
      url: '/user/reset-password',
      type: 'post',
      contentType: 'application/json',
      dataType: 'json',
      data: JSON.stringify({
        account: account,
        emailCode: emailCode,
        newPassword: newPassword
      }),
      success: function (result) {
        if (result.code !== 200) {
          notifyError(result.message || '重置密码失败');
          return;
        }

        notifySuccess('密码重置成功，请重新登录');
        setTimeout(function () {
          location.href = '/blogin.html';
        }, 1500);
      },
      error: function (xhr) {
        notifyError('重置密码失败：' + xhr.status);
      },
      complete: function () {
        $submitBtn.prop('disabled', false).text('重置密码');
      }
    });
  }

  $(document).ready(function () {
    $('#getResetCodeBtn').on('click', sendResetCode);

    $('#resetPasswordForm').on('submit', function (event) {
      event.preventDefault();
      submitResetPassword();
    });
  });
</script>
</body>
</html>
