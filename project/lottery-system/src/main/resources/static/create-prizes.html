<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>创建奖品</title>
    <link rel="stylesheet" href="./css/bootstrap.min.css">
    <link rel="stylesheet" href="./css/base.css"></link>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: white;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 800px;
            margin: 10px auto;
            padding: 20px;
            background-color: #fff;
            /* box-shadow: 0 0 10px rgba(0, 0, 0, 0.1); */
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
        }
        .form-group input[type=text],
        .form-group input[type=url] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .form-group textarea {
            width: 100%;
            height: 100px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .btn {
            border: none;
            border-radius: 6px;
            cursor: pointer;
            width: 140px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
        }
        .prize-row {
            margin-bottom: 10px;
        }
        .container h2{
            font-weight: 600;
            font-size: 30px;
            letter-spacing: 1px;
            color: #000000;
            line-height: 50px;
            text-align: center;
            margin-bottom: 40px;
        }
        .upload-box{
            display: flex;
            width: 150px;
            height: 150px;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: 1px dashed  #4c8dfb;
            background-color: #EDF3FE;
            cursor: pointer;
            margin-bottom: 10px;
            position: relative;
            border-radius: 8px;
            overflow: hidden;
        }
        .plus{
            color: #4C8DFB;
            font-size: 30px;
        }
        .up-txt{
            font-weight: 400;
            font-size: 14px;
            color: #4C8DFB;
        }
        .upload-box .form-control{
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 100%;
            opacity: 0;
            z-index: 2;
        }
        .preview-img{
            width: 150px;
            height: 150px;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
            display: none;
            background-color: #fff;
            object-fit: scale-down;
        }
    </style>
</head>
<body>
<div class="container">
    <h2>开始创建奖品</h2>
    <div id="prizeRows">
        <div class="prize-row">
            <div class="form-group">
                <label for="prizeName">奖品名称</label>
                <input class="form-control" type="text" placeholder="请输入奖品名称" id="prizeName" name="prizeName" class="prize-name" maxlength="255" required>
            </div>
            <div class="form-group">
                <label for="prizeName">奖品图片</label>
                <div class="img-upload">
                    <!-- 上传图片的框 -->
                    <div class="upload-box">
                        <span class="plus">+</span>
                        <span class="up-txt">上传图片</span>
                        <!-- 预览图 -->
                        <img src="./pic/bg.png" class="preview-img" id="previewImg" alt="" srcset="">
                        <input class="form-control" type="file" onchange="showImg()" id="prizeImageUrl" >
                    </div>
                </div>
            </div>
            <div class="form-group">
                <label for="price">奖品价格</label>
                <input class="form-control" placeholder="请输入奖品价格" type="number" id="price" name="price" class="prize-price" required>
            </div>
            <div class="form-group">
                <label for="description">奖品描述</label>
                <textarea class="form-control" id="description" placeholder="请输入奖品描述"  name="description" class="prize-description" maxlength="255" required></textarea>
            </div>
        </div>
    </div>
    <button type="submit" class="btn btn-primary" onclick="submitPrizes()">创建奖品</button>
</div>

<script src="./js/jquery.min.js"></script>
<script src="./js/auth.js"></script>
<script>
    var previewObjectUrl = null;

    // 提交奖品：奖品信息和图片放在同一个 multipart 请求里，由后端内部调用上传服务
    function submitPrizes() {
        var prizeName = $('#prizeName').val().trim();
        var description = $('#description').val().trim();
        var price = $('#price').val();
        var file = document.getElementById('prizeImageUrl').files[0];

        if (!prizeName) {
            alert('请输入奖品名称');
            return;
        }
        if (!price || Number(price) <= 0) {
            alert('请输入正确的奖品价格');
            return;
        }
        if (!description) {
            alert('请输入奖品描述');
            return;
        }
        if (!file) {
            alert('请选择奖品图片');
            return;
        }

        var formData = new FormData();
        formData.append('prizeName', prizeName);
        formData.append('description', description);
        formData.append('price', price);
        formData.append('prizePic', file);

        $.ajax({
            url: '/prize/create',
            type: 'post',
            data: formData,
            processData: false,
            contentType: false,
            success: function (result) {
                if (result.code === 200) {
                    alert('奖品创建成功！');
                    // 在后台 iframe 中：通知父页面切换到奖品列表，由父页面带上时间戳重新加载 iframe，避免缓存
                    // 直接打开创建页时没有父页面，退化为普通跳转
                    if (window.parent !== window) {
                        window.parent.postMessage({
                            from: 'prizes-list.html',
                            id: '#prizesList'
                        }, '*');
                    } else {
                        window.location.href = '/prizes-list.html?param=' + new Date().getTime();
                    }
                } else {
                    alert('创建奖品失败：' + result.message);
                }
            },
            error: function (xhr) {
                console.log(xhr);
                if (xhr.status === 401) {
                    alert('用户未登录，即将跳转到登录页!');
                    window.location.href = '/blogin.html';
                    window.parent.location.href = '/blogin.html';
                } else if (xhr.status === 403) {
                    alert('无权限创建奖品');
                } else {
                    alert('创建奖品失败：' + xhr.status);
                }
            }
        });
    }

    // 只做本地预览，不在这里上传；图片随表单一起提交
    function showImg() {
        var file = document.getElementById('prizeImageUrl').files[0];
        if (!file) {
            return;
        }
        if (previewObjectUrl) {
            URL.revokeObjectURL(previewObjectUrl);
        }
        previewObjectUrl = URL.createObjectURL(file);
        $('#previewImg').attr('src', previewObjectUrl).show();
    }
</script>
</body>
</html>
