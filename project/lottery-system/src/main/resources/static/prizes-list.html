<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>奖品列表</title>
    <link rel="stylesheet" href="./css/bootstrap.min.css">
    <link rel="stylesheet" href="./css/base.css"></link>
    <style>
    body {
      font-family: Arial, sans-serif;
      padding: 0 30px;
    }
    table {
      /* height: calc(100vh - 143px); */
      height: 300px;
    }
    .table td, .table th{
      border: none;
    }
    .table thead th{
      background-color: #f7f7f7;
      border-bottom: none;
      font-weight: 600;
      font-size: 16px;
      color: #999999;
      height: 80px;
      line-height: 80px;
      padding: 0;
      position: sticky;
      top: 0px;
    }
    .table tbody+tbody{
      border-top: none;
    }
    .prize-table {
      width: 100%; /* 表格宽度为容器宽度的100% */
      height: 100vh;
      overflow-y: auto;
    }
    .prize-table h2{
      background: #fff;
      width: 100%;
      font-weight: 600;
      font-size: 18px;
      color: #000000;
      height: 70px;
      display: flex;
      align-items: center;
      margin-bottom: 0;
    }
    .table-box{
      height: calc(100vh - 140px);
      overflow-y: auto;
    }
    .prize-table th, .prize-table td {
        text-align: center;
        vertical-align: middle;
        padding: 10px;
        height: 50px; /* 统一设置表头和单元格的高度 */
    }
    /* 第一列和第三列的样式 */
    .prize-table th:first-child, .prize-table td:first-child,
    .prize-table th:nth-child(3), .prize-table td:nth-child(3),
    .prize-table th:nth-child(5), .prize-table td:nth-child(5) {
        width: 15%; /* 设置第一列和第三列的宽度为15% */
    }
    /* 第四列的样式 */
    .prize-table th:nth-child(4), .prize-table td:nth-child(4) {
        width: 30%; /* 设置第四列的宽度为30% */
    }
    /* 其他列的样式（例如第二列和第五列） */
    .prize-table th:nth-child(2), .prize-table td:nth-child(2) {
        width: 25%; /* 保持第二列和第五列的宽度为20% */
    }
    .prize-table th {
      /* 如果有特定的样式只适用于表头，可以在这里添加 */
    }
    .prize-table td {
      height: 100px; /* 特定于单元格的高度设置 */
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 300px;
    }
    .prize-table img{
      width: 76px;
      height: 76px;
      border-radius: 8px;
      object-fit: scale-down;
      border:1px solid #e4e4e4;
    }
    .pagination {
      display: flex;
      justify-content: flex-end;
      margin-top: 18px;
      padding-right: 16px;
    }
    .pagination button {
      margin: 0 5px; /* 按钮之间的间距保持不变 */
      border-radius: 5px; /* 设置圆角为20像素，可以根据需要调整 */
      border: 1px solid #007bff;
      background-color: #fff;
      padding: 0px 8px; /* 可以添加一些内边距，使按钮看起来更饱满 */
      cursor: pointer; /* 将鼠标光标改为指针形状，提升用户体验 */
      font-size: 13px;
    }
    .pagination span{
      margin: 0 10px;
      font-size: 14px;
    }
    .pagination input{
      width: 80px;
      text-align: center;
    }
  </style>
</head>
<body>
<div class=" prize-table">
    <h2>奖品列表</h2>
    <div class="table-box">
      <table class="table">
        <thead>
        <tr>
            <th>奖品id</th>
            <th>奖品图</th>
            <th>奖品名</th>
            <th>奖品描述</th>
            <th>奖品价值</th>
        </tr>
        </thead>
        <tbody id="prizeList">
            <!-- 奖品列表将动态插入这里 -->
        </tbody>
      </table>
    </div>
    <div class="pagination">
        <button class="btn-outline-primary" onclick="fetchPrizes(1)">首页</button>
        <button class="btn-outline-primary" onclick="previousPage()">上一页</button>
        <span>第 <input type="number" id="pageInput" min="1" value="1" /> 页</span>
        <button class="btn-outline-primary" onclick="nextPage()">下一页</button>
        <button class="btn-outline-primary" onclick="fetchPrizes(totalPages)">尾页</button>
    </div>
</div>


<script src="./js/jquery.min.js"></script>
<script src="./js/auth.js"></script>
<script>
    var currentPage = 1;
    var pageSize = 10;
    var totalPages = 1;

    // 转义文本，避免奖品名/描述里的 HTML 被当成标签执行
    function escapeHtml(value) {
      return $('<div>').text(value == null ? '' : value).html();
    }

    // 转义属性值，避免引号截断 src/alt
    function escapeAttr(value) {
      return escapeHtml(value).replace(/"/g, '&quot;');
    }

    // 查询指定页的奖品列表，并刷新表格和分页控件
    function fetchPrizes(page) {
      // 如果页码小于1，则重置为1
      if (page < 1) {
        page = 1;
      }

      currentPage = page;

      $.ajax({
          url: '/prize/list',
          type: 'get',
          // 动态列表不缓存，避免创建奖品后仍看到旧数据
          cache: false,
          data: {
            currentPage: currentPage,
            pageSize: pageSize
          },
          dataType: 'json',
          success: function(result) {
            if (result.code !== 200) {
                alert("查询奖品列表失败！" + result.message);
                return;
            }

            var data = result.data || {};
            var prizes = data.records || [];
            var prizeList = $('#prizeList').empty();

            if (prizes.length === 0) {
                prizeList.append('<tr><td colspan="5">暂无数据</td></tr>');
            } else {
                prizes.forEach(function(prize) {
                    var imageUrl = prize.imageUrl ? prize.imageUrl : '/pic/defaultPrizeImg.png';
                    var priceText = prize.price == null ? '' : Number(prize.price).toFixed(2);
                    prizeList.append('<tr> ' +
                            '<td>' + escapeHtml(prize.prizeId) + '</td>' +
                            '<td><img src="' + escapeAttr(imageUrl) + '" alt="' + escapeAttr(prize.prizeName) + '" class="prize-image"></td>' +
                            '<td>' + escapeHtml(prize.prizeName) + '</td>' +
                            '<td>' + escapeHtml(prize.description) + '</td>' +
                            '<td>' + priceText + '元</td>' +
                            '</tr>');
                });
            }

            totalPages = Math.max(1, Math.ceil((data.total || 0) / pageSize));
            $('#pageInput').val(currentPage);
          },
          error:function(xhr){
              console.log(xhr);
              if(xhr.status === 401){
                  alert("用户未登录, 即将跳转到登录页!");
                  window.parent.location.href = "/blogin.html";
              } else if (xhr.status === 403) {
                  alert("无权限查看奖品列表");
              } else {
                  alert("查询奖品列表失败：" + xhr.status);
              }
          }
      });
    }

    function previousPage() {
      if (currentPage > 1) {
        fetchPrizes(currentPage - 1);
      } else {
        alert("已经是第一页");
      }
    }

    function nextPage() {
      if (currentPage < totalPages) {
        fetchPrizes(currentPage + 1);
      } else {
        alert("已经是最后一页");
      }
    }

    $(document).ready(function() {
      fetchPrizes(1);
    });

    // 绑定输入框回车事件
    $('#pageInput').on('keypress', function(e) {
      if (e.key === 'Enter') {
        var page = parseInt(this.value, 10);
        if (!isNaN(page) && page >= 1 && page <= totalPages) {
          fetchPrizes(page);
        }
      }
    });

</script>
</body>
</html>
