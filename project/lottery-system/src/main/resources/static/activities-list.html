<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>活动列表</title>
  <link rel="stylesheet" href="./css/bootstrap.min.css">
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/toastr.min.css">
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f2f2f2;
    }
    .activity-list {
      padding:0 30px;
    }
    #activities{
      height: calc(100vh - 134px);
      overflow-y: auto;
      padding-right: 10px;
    }
    .activity-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: #f7f7f7;
      padding: 24px;
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 10px;
      border-radius: 8px;
      padding-bottom: 12px;
    }
    .activity-info{
      width: calc(100% - 120px);
    }
    .activity-info h4{
      width: 100%;
      font-weight: 600;
      font-size: 15px;
      color: #000000;
      margin-bottom: 4px;
    }
    .activity-info p{
      font-weight: 400;
      font-size: 14px;
      color: #666666;
      margin: 0;
      line-height: 28px;
    }
    .active a{
      font-weight: 400;
      font-size: 15px;
      color: red;
      margin-bottom: 0;
      display: block;
      width: 250px;
    }
    .inactive a{
      font-weight: 400;
      font-size: 15px;
      color: gray;
      margin-bottom: 0;
      display: block;
      width: 250px;
    }
    .pagination {
      display: flex;
      justify-content: flex-end;
      margin-top: 18px;
      padding-right: 16px;
    }
    .pagination button {
      margin: 0 5px; /* 按钮之间的间距保持不变 */
      border-radius: 5px; /* 设置圆角为20像素，可以根据需要调整 */
      border: 1px solid #007bff;
      background-color: #fff;
      padding: 0px 8px; /* 可以添加一些内边距，使按钮看起来更饱满 */
      cursor: pointer; /* 将鼠标光标改为指针形状，提升用户体验 */
      font-size: 13px;
    }
    .pagination span{
      margin: 0 10px;
      font-size: 14px;
    }
    .pagination input{
      width: 80px;
      text-align: center;
    }
    .activity-list h2 {
      font-weight: 600;
      font-size: 18px;
      color: #000000;
      height: 70px;
      display: flex;
      align-items: center;
      margin-bottom: 0;
    }
  </style>
</head>
<body style="background-color: white">
<div class="activity-list">
  <h2>活动列表</h2>
  <div id="activities">
    <!-- 活动列表将动态插入这里 -->
  </div>
  <div class="pagination">
    <button class="btn-outline-primary" onclick="fetchActivities(1)">首页</button>
    <button class="btn-outline-primary" onclick="previousPage()">上一页</button>
    <span>第 <input type="number" id="pageInput" min="1" value="1" /> 页</span>
    <button class="btn-outline-primary" onclick="nextPage()">下一页</button>
    <button class="btn-outline-primary" onclick="fetchActivities(totalPages)">尾页</button>
  </div>
</div>

<script src="./js/jquery.min.js"></script>
<script src="./js/auth.js"></script>
<script src="./js/toastr.min.js"></script>
<script>
    var currentPage = 1;
    var pageSize = 10;
    var totalPages = 1;

    // 转义文本，避免活动名/描述里的 HTML 被当成标签执行
    function escapeHtml(value) {
      return $('<div>').text(value == null ? '' : value).html();
    }

    // 查询指定页的活动列表
    function fetchActivities(page) {
      // 如果页码小于1，则重置为1
      if (page < 1) {
        page = 1;
      }
      // 更新当前页码
      currentPage = page;

      $.ajax({
          url: '/activity/list',
          type: 'get',
          // 动态列表不缓存，避免创建活动后仍看到旧数据
          cache: false,
          data: {
            currentPage: currentPage,
            pageSize: pageSize
          },
          dataType: 'json',
          success: function(result) {
            if (result.code !== 200) {
                alert("查询活动列表失败！" + result.message);
                return;
            }

            var activities = (result.data && result.data.records) || [];
            var activitiesHtml = '';
            activities.forEach(function(activity) {
              var url = 'draw.html?activityName=' + encodeURIComponent(activity.activityName)
                      + '&activityId=' + encodeURIComponent(activity.activityId)
                      + '&valid=' + encodeURIComponent(activity.valid);
              var linkTextActive = `<a href="${url}" target="_blank">活动进行中，去抽奖</a>`;
              var linkTextInactive = `<a href="${url}" target="_blank">活动已完成，查看中奖名单</a>`;
              var validClass = activity.valid ? 'active' : 'inactive';
              var link = activity.valid ? linkTextActive : linkTextInactive;
              activitiesHtml += `
                  <div class="activity-item">
                    <div class="activity-info">
                      <h4>${escapeHtml(activity.activityName)}</h4>
                      <p>${escapeHtml(activity.description)}</p>
                    </div>
                    <div class="${validClass}">
                      <p>${link}</p>
                    </div>
                  </div>
                `;
            });
            $('#activities').html(activitiesHtml);

            // 更新分页控件的总页数
            totalPages = Math.max(1, Math.ceil((result.data.total || 0) / pageSize));
            // 更新输入框的值
            $('#pageInput').val(currentPage);
          },
        error:function(xhr){
          console.log(xhr);
          if(xhr.status === 401){
            alert("用户未登录, 即将跳转到登录页!");
            window.parent.location.href = "/blogin.html";
          } else if (xhr.status === 403) {
            alert("无权限查看活动列表");
          } else {
            alert("查询活动列表失败：" + xhr.status);
          }
        }
      });
    }


    function previousPage() {
      if (currentPage > 1) {
        fetchActivities(currentPage - 1);
      } else {
        alert("已经是第一页");
      }
    }

    function nextPage() {
      if (currentPage < totalPages) {
        fetchActivities(currentPage + 1);
      } else {
        alert("已经是最后一页");
      }
    }

    $(document).ready(function() {
      fetchActivities(1);
    });

    // 绑定输入框回车事件
    $('#pageInput').on('keypress', function(e) {
      if (e.key === 'Enter') {
        var page = parseInt(this.value);
        if(page > totalPages){
          page = totalPages
          $('#pageInput').val(totalPages);
        }
        if (!isNaN(page) && page >= 1 && page <= totalPages) {
          fetchActivities(page);
        }
      }
    });

</script>
</body>
</html>
