    <rect x="206" y="150" width="100" height="120" rx="18" fill="#ffffff" opacity="0.16"/>
    <circle cx="228" cy="172" r="10" fill="#ffffff" opacity="0.35"/>
    <circle cx="256" cy="172" r="10" fill="#ffffff" opacity="0.35"/>
    <circle cx="284" cy="172" r="10" fill="#ffffff" opacity="0.35"/>
    <rect x="206" y="306" width="100" height="12" rx="6" fill="#ffffff" opacity="0.28"/>
    <rect x="206" y="330" width="64" height="12" rx="6" fill="#ffffff" opacity="0.20"/>
