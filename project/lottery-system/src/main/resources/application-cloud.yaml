# 云服务器 / Docker Compose 配置：连接名由 compose 注入，全部使用容器服务名。
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/${DB_NAME:lottery_system}?characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:lottery}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      timeout: 60s
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: 5s
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:lottery}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: ${RABBITMQ_VHOST:lottery}
    connection-timeout: 3s
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          initial-interval: 1s
          multiplier: 2
          max-interval: 10s
          max-retries: 3

server:
  port: 8080
  # 由 Nginx / 反向代理转发时保留真实协议和 Host
  forward-headers-strategy: framework

lottery:
  draw:
    # 云上开启补偿扫描，兜底 MQ 投递失败或消费者异常退出的任务
    compensation:
      enabled: ${COMPENSATION_ENABLED:true}
  upload:
    dir: /app/uploads

logging:
  file:
    name: /app/logs/springboot.log
  level:
    root: info

mybatis-plus:
  configuration:
    # 云上关闭 SQL 明细日志，避免日志膨胀和敏感数据落盘
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
