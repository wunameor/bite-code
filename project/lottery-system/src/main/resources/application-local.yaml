# 本地开发配置：默认连接 127.0.0.1 上的 MySQL、Redis、RabbitMQ。
# 需要覆盖连接信息时设置 DB_HOST / DB_PORT / DB_NAME / DB_USERNAME / DB_PASSWORD 等环境变量即可。
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:lottery_system}?characterEncoding=utf8&useSSL=true
    username: ${DB_USERNAME:root}
    password: "${DB_PASSWORD:123456}"
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      timeout: 60s #连接空闲超过N(s秒、ms毫秒)后关闭，0为禁用，这里配置值和tcp-keepalive值一致
      lettuce:
        pool:
          max-active: 8  #允许最大连接数
          max-idle: 8 #最大空闲连接数, 默认8
          min-idle: 0  #最小空闲连接数
          max-wait: 5s  #请求获取连接等待时间
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:lottery}
    password: ${RABBITMQ_PASSWORD:lottery}
    virtual-host: ${RABBITMQ_VHOST:lottery}
    connection-timeout: 3s
    listener:
      simple:
        # 消费失败时不重新入队，交给死信队列留痕
        default-requeue-rejected: false
        # 瞬时异常在容器内重试；重试用尽后拒绝消息并进入 DLQ，
        # draw_request 的补偿任务再用独立配置做长时间兜底。
        retry:
          enabled: true
          initial-interval: 1s
          multiplier: 2
          max-interval: 10s
          max-retries: 3

lottery:
  draw:
    # 本地调试默认关闭，避免定时扫描刷 SQL 日志；需要验证异步补偿时改为 true。
    compensation:
      enabled: ${COMPENSATION_ENABLED:false}
  upload:
    dir: ${user.dir}/uploads

logging:
  file:
    name: logs/springboot.log
  level:
    root: info

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl  # 本地打印执行的 SQL，方便调试
