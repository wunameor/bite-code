spring:
  application:
    name: lottery-system
  # 不指定 SPRING_PROFILES_ACTIVE 时默认走本地配置；云服务器由 compose 注入 cloud
  profiles:
    default: local
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB
  # QQ 邮箱 SMTP。授权码获取：QQ邮箱 -> 设置 -> 账号 -> 开启「POP3/SMTP 服务」-> 短信验证 -> 16 位授权码
  # 凭证不要写死在文件里，本地在运行配置里配置，云服务器写在 .env：
  #   MAIL_USERNAME=你的QQ号@qq.com
  #   MAIL_PASSWORD=上一步拿到的授权码（不是 QQ 密码）
  mail:
    host: smtp.qq.com
    port: 465
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    # 设为 true 可在启动时立刻校验 SMTP 配置，凭证配好后再打开
    test-connection: false
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

lottery:
  # 抽奖异步任务补偿：PENDING 超时重投，PROCESSING 超时重置重投
  draw:
    compensation:
      enabled: false
      max-attempts: 3
      pending-delay: 10s
      processing-timeout: 5m
      scan-interval: 30s
  upload:
    url-prefix: /uploads
    max-size: 5MB
    allowed-extensions:
      - jpg
      - jpeg
      - png
      - gif
      - webp

logging:
  logback:
    rollingpolicy:
      max-file-size: 10MB
      file-name-pattern: ${LOG_FILE}.%d{yyyy-MM-dd}.%i

mybatis-plus:
  type-handlers-package: com.wunamor.lotterysystem.mapper.handler
  # 设置 Mybatis 的 xml 保存路径
  mapper-locations: classpath:mapper/*Mapper.xml
  configuration:
    map-underscore-to-camel-case: true  #自动驼峰转换
